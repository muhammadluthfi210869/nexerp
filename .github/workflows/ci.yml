# ═══════════════════════════════════════════════════════════════
#  CI — Build, Test & Push (Pipeline Teroptimasi, Branch main)
# ═══════════════════════════════════════════════════════════════
#  Optimasi 2026-09-16 (§11 & §12 PANDUAN-TESTING-DAN-DEPLOY-LENGKAP):
#    - PR: Fast regression & contracts check (~30 detik, tanpa Docker build)
#    - Push to main: Single-pass pipeline (~8-10 menit):
#        1. Build backend image & tag (1x build)
#        2. Boot backend dengan Postgres test service
#        3. Run test-deploy.sh (smoke 6/6)
#        4. Run pre-flight E2E smoke (auth revita, members count, dual-write)
#        5. Push backend image ke GHCR
#        6. Build & push frontend image ke GHCR (1x build, production args)
#    - VPS (4GB) hanya pull image per-SHA, tanpa build
# ═══════════════════════════════════════════════════════════════

name: 🔨 CI — Build, Test & Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ── FAST GATE UNTUK PULL REQUEST (~30 detik) ────────────────
  fast-gate:
    name: ⚡ Fast Contract & Regression Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🧪 Run All Regression & Contract Tests
        run: |
          chmod +x scripts/*.sh scripts/__tests__/*.sh backend/init-db.sh
          bash scripts/__tests__/run-all.sh

  # ── MAIN PIPELINE: TEST, PRE-FLIGHT SMOKE & PUSH KE GHCR ───
  push-images:
    name: 🚀 Test, Smoke & Push Images ke GHCR
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧪 Run Regression & Contract Tests
        run: |
          chmod +x scripts/*.sh scripts/__tests__/*.sh backend/init-db.sh
          bash scripts/__tests__/run-all.sh

      - name: 🏗️ Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: |
            nexerp-backend:test
            ${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🚀 Start Backend
        run: |
          docker run -d --name nexerp-backend-test \
            --network host \
            -e PORT=3001 \
            -e NODE_ENV=production \
            -e DATABASE_URL="postgresql://test_user:test_pass@localhost:5432/test_db?schema=public" \
            -e JWT_SECRET="test-secret-do-not-use-in-production" \
            -e AES_SECRET_KEY="aureon_erp_v4_ultra_secret_key_32" \
            -e CORS_ORIGIN="http://localhost:3000,https://nexerp.id" \
            nexerp-backend:test

          echo "⏳ Menunggu backend siap..."
          for i in $(seq 1 60); do
            sleep 2
            HEALTH=$(curl -sf http://localhost:3001/v1/health 2>/dev/null || echo "")
            if [ -n "$HEALTH" ]; then
              echo "✅ Backend siap setelah ${i}x2s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "❌ Backend gagal start!"
              docker logs nexerp-backend-test --tail 50
              exit 1
            fi
          done

      - name: 🩺 Standard Integration Tests (6/6)
        run: |
          chmod +x scripts/test-deploy.sh
          bash scripts/test-deploy.sh http://localhost:3001/v1

      - name: 🔍 Pre-Flight E2E Smoke Tests
        run: |
          set -e
          BASE="http://localhost:3001/v1"
          echo "=== 1. Login Check (DIGIMAR User) ==="
          LOGIN_RES=$(curl -s -X POST "$BASE/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"revita@nexerp.id","password":"password123"}')
          TOKEN=$(echo "$LOGIN_RES" | jq -r '.access_token // .accessToken // empty')
          [ -n "$TOKEN" ] || { echo "❌ Pre-flight: Login gagal untuk revita@nexerp.id:"; echo "$LOGIN_RES"; exit 1; }
          echo "✅ Login berhasil, token diperoleh"

          echo "=== 2. Marketing Members Check (Dept Whitelist & Seed Shape) ==="
          MEMBERS_RES=$(curl -sf -X GET "$BASE/marketing/members" \
            -H "Authorization: Bearer $TOKEN" || echo "[]")
          COUNT=$(echo "$MEMBERS_RES" | jq 'length')
          [ "$COUNT" -gt 0 ] || { echo "❌ Pre-flight: /marketing/members kosong (0 anggota)"; exit 1; }
          echo "✅ /marketing/members mengembalikan $COUNT anggota"

          echo "=== 3. Dual-Write Task Creation Check ==="
          REVITA_ID=$(echo "$LOGIN_RES" | jq -r '.user.id // empty')
          CREATE_RES=$(curl -sf -X POST "$BASE/marketing/tasks" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"title\":\"CI Pre-flight Task\",\"assigneeId\":\"$REVITA_ID\",\"type\":\"DAILY\",\"priority\":\"LOW\",\"channel\":\"web\",\"category\":\"smoke\",\"startDate\":\"2026-09-15\",\"dueDate\":\"2026-09-16\"}" || echo "")
          echo "$CREATE_RES" | jq -e '.id // .taskCode // .status' >/dev/null \
            || { echo "❌ Pre-flight: createTask dual-write gagal"; echo "$CREATE_RES"; exit 1; }
          echo "✅ Dual-write createTask terverifikasi"

          echo "=== 4. Prototype Route Disabled Check ==="
          PROTO_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" "$BASE/marketing/prototype/bundle")
          [ "$PROTO_CODE" = "404" ] || { echo "❌ Pre-flight: prototype endpoint masih aktif (HTTP $PROTO_CODE)"; exit 1; }
          echo "✅ Prototype endpoint non-aktif (HTTP 404)"

      - name: 📦 Push Backend Image ke GHCR
        run: |
          docker push "${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}"
          docker push "${{ env.IMAGE_PREFIX }}/backend:latest"

      - name: 📦 Build & Push Frontend Image ke GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/frontend:latest
          build-args: |
            # ponytail: nginx rewrite ^/api/(.*) /v1/$1 (nginx.conf:80).
            # Browser hits /api/<path>; nginx adds /v1/ → backend /v1/<path>.
            # Setting base to /api (NOT /api/v1) avoids double-prefix 404.
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://nexerp.id/api' }}
            NEXT_PUBLIC_WA_PHONE=${{ vars.NEXT_PUBLIC_WA_PHONE || '6287793032556' }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📝 Logs (jika gagal)
        if: failure()
        run: docker logs nexerp-backend-test --tail 100 || true

      - name: 🧹 Bersihkan container
        if: always()
        run: docker rm -f nexerp-backend-test 2>/dev/null || true

      - name: ✅ Ringkasan Rilis
        run: |
          echo "### 🚀 Build & Test Berhasil — Image Ter-push ke GHCR" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy ke VPS: \`ssh dreamlab@103.93.134.215\` → \`cd /home/dreamlab/nexerp && bash scripts/deploy.sh ${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
