# ═══════════════════════════════════════════════════════════════
#  CI — Build & Test (TIDAK ada deploy)
# ═══════════════════════════════════════════════════════════════
#  Fungsi: memverifikasi bahwa build berhasil dan integration
#  test lolos. Deploy dilakukan manual dari server:
#
#    git pull && docker compose --profile server up -d --build
#
#  Kenapa tidak ada deploy di CI?
#  - Build di CI dan di server pakai Dockerfile yang SAMA
#  - Docker compose file NYA SAMA di lokal dan server
#  - Yang beda cuma file .env, jadi harus diisi manual di server
#  - Tidak perlu GHCR, staging, dll — deploy 1 menit!
# ═══════════════════════════════════════════════════════════════

name: 🔨 CI — Build & Test

on:
  push:
    branches: [production-light, main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: 🔨 Build & Integration Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: nexerp-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: nexerp-frontend:test
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3001
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🚀 Start Backend
        run: |
          docker run -d --name nexerp-backend-test \
            --network host \
            -e PORT=3001 \
            -e NODE_ENV=production \
            -e DATABASE_URL="postgresql://test_user:test_pass@localhost:5432/test_db?schema=public" \
            -e JWT_SECRET="test-secret-do-not-use-in-production" \
            -e AES_SECRET_KEY="aureon_erp_v4_ultra_secret_key_32" \
            -e CORS_ORIGIN="http://localhost:3000,https://nexerp.id" \
            nexerp-backend:test

          echo "⏳ Menunggu backend siap..."
          for i in $(seq 1 60); do
            sleep 2
            HEALTH=$(curl -sf http://localhost:3001/health 2>/dev/null || echo "")
            if [ -n "$HEALTH" ]; then
              echo "✅ Backend siap setelah ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "❌ Backend gagal start!"
              docker logs nexerp-backend-test --tail 50
              exit 1
            fi
          done

      - name: 🩺 Integration Tests
        run: |
          chmod +x scripts/test-deploy.sh
          bash scripts/test-deploy.sh http://localhost:3001

      - name: 📝 Logs (jika gagal)
        if: failure()
        run: docker logs nexerp-backend-test --tail 100

      - name: 🧹 Bersihkan container
        if: always()
        run: docker rm -f nexerp-backend-test 2>/dev/null || true
