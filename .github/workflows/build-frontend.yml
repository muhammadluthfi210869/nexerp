name: Build Production Frontend

# Builds the production-light-frontend Docker image on GitHub runners (NVMe,
# 16 GB) and uploads the result as an artifact for transfer to Biznet.
# Triggered on push to production-light, release/r4-candidate, or manual.

on:
  push:
    branches:
      - production-light
      - release/r4-candidate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build production-light-frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=https://nexerp.id/api
            NEXT_PUBLIC_WA_PHONE=6287793032556
          tags: production-light-frontend:latest
          outputs: type=docker,dest=/tmp/frontend-image.tar
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Show image size
        run: ls -lh /tmp/frontend-image.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-light-frontend
          path: /tmp/frontend-image.tar
          retention-days: 7
          if-no-files-found: error
