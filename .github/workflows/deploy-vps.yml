name: 🚀 Deploy ke VPS

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA atau tag yang ingin di-deploy'
        required: false
        default: 'latest'

jobs:
  deploy:
    name: 🌐 Direct Deploy on VPS
    runs-on: self-hosted

    steps:
      - name: 🧹 Free Disk Space on VPS
        run: |
          docker image prune -af --filter "until=1h" || true
          docker builder prune -af || true
          df -h /

      - name: 🚀 Run Deployment Script on VPS
        run: |
          set -euo pipefail
          cd /home/dreamlab/nexerp
          git fetch origin main
          git reset --hard origin/main
          bash scripts/deploy.sh "${{ github.event.inputs.sha || 'latest' }}"
