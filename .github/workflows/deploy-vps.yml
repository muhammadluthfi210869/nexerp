name: 🚀 Deploy ke VPS

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA atau tag yang ingin di-deploy'
        required: false
        default: 'latest'

jobs:
  deploy:
    name: 🌐 Remote Deploy on VPS
    runs-on: ubuntu-latest

    steps:
      - name: 🔑 Set up SSH Key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          if [ -n "$KNOWN_HOSTS" ]; then
            echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          fi
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 🚀 Run Deployment Script on VPS
        env:
          USER: ${{ secrets.VPS_USER }}
          HOST: ${{ secrets.VPS_HOST }}
          SHA: ${{ inputs.sha }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 "$USER@$HOST" "
            set -euo pipefail
            cd /home/dreamlab/nexerp
            git fetch origin main
            git reset --hard origin/main
            bash scripts/deploy.sh $SHA
          "
