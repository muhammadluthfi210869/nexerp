name: 🚀 Deploy NexERP Production

on:
  push:
    branches: [production-light]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (default: latest)'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository }}/backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}/frontend

jobs:
  # ── 1. BUILD & TEST ──────────────────────────
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📦 Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: 🔨 Build Backend
        run: |
          docker compose -f docker-compose.prod.yml build backend

      - name: 🔨 Build Frontend
        run: |
          docker compose -f docker-compose.prod.yml build frontend
        env:
          NEXT_PUBLIC_API_URL: https://${{ secrets.DOMAIN_NAME }}/api

      - name: 🩺 Test Health Endpoint (local)
        run: |
          docker compose -f docker-compose.prod.yml up -d db backend
          sleep 15
          curl -sf http://localhost:3001/health || {
            echo "❌ Health check FAILED"
            docker compose logs backend --tail 20
            exit 1
          }
          echo "✅ Health check PASSED"
          docker compose down

  # ── 2. PUSH TO REGISTRY ─────────────────────
  push-images:
    name: 📤 Push to GHCR
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Generate tags
        id: meta
        run: |
          echo "tag=${{ github.event.inputs.tag || 'latest' }}" >> $GITHUB_OUTPUT
          echo "sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: 📦 Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_BACKEND }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📦 Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_FRONTEND }}:${{ steps.meta.outputs.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ secrets.DOMAIN_NAME }}/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. DEPLOY TO VPS ─────────────────────────
  deploy:
    name: 🌍 Deploy to VPS
    needs: push-images
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: 🔑 Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}

      - name: 📄 Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "./docker-compose.prod.yml,./nginx.conf"
          target: "/opt/nexerp"

      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}

          script: |
            set -e

            echo "=== 🟢 NEXERP DEPLOY ==="
            cd /opt/nexerp

            # ── Login to GHCR ──
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # ── Pull latest images ──
            docker pull ${{ env.IMAGE_BACKEND }}:latest
            docker pull ${{ env.IMAGE_FRONTEND }}:latest

            # ── Backup DB before deploy (safety!) ──
            echo "📦 Backing up database..."
            docker exec nexerp-db-1 pg_dump -U ${{ secrets.DB_USER }} ${{ secrets.DB_NAME }} > /opt/nexerp/backups/pre-deploy-$(date +%Y%m%d-%H%M%S).sql 2>/dev/null || echo "⚠️ DB backup skipped (container might use different name)"

            # ── Deploy ──
            docker compose -f docker-compose.prod.yml up -d --force-recreate

            # ── Health check ──
            echo "⏳ Waiting 20s for health check..."
            sleep 20

            HEALTH=$(curl -sf http://localhost:3001/health 2>/dev/null || echo "FAIL")
            if [ "$HEALTH" = "FAIL" ]; then
              echo "❌ Health check FAILED! Rolling back..."

              # Rollback: pull previous tag
              docker compose -f docker-compose.prod.yml down
              docker pull ${{ env.IMAGE_BACKEND }}:rollback 2>/dev/null || true
              docker compose -f docker-compose.prod.yml up -d

              echo "❌ DEPLOY FAILED — rolled back to previous version"
              exit 1
            fi

            # ── Tag current as rollback point ──
            docker tag ${{ env.IMAGE_BACKEND }}:latest ${{ env.IMAGE_BACKEND }}:rollback 2>/dev/null || true
            docker tag ${{ env.IMAGE_FRONTEND }}:latest ${{ env.IMAGE_FRONTEND }}:rollback 2>/dev/null || true

            # ── Cleanup old images ──
            docker image prune -f

            echo "✅ DEPLOY SUCCESSFUL — $(date)"
            echo "   Backend: ${{ env.IMAGE_BACKEND }}:latest"
            echo "   Frontend: ${{ env.IMAGE_FRONTEND }}:latest"
            echo "   Rollback available as :rollback tag"
