name: 🚀 Deploy NexERP (Test → Staging → Production)

on:
  push:
    branches: [production-light]
  workflow_dispatch:
    inputs:
      skip_staging:
        description: 'Skip staging (deploy langsung ke production)'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository }}/backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}/frontend

jobs:
  # ═══════════════════════════════════════════════════════════
  #  PHASE 1: BUILD + TEST (di Linux CI, bukan lokal!)
  # ═══════════════════════════════════════════════════════════
  build-and-test:
    name: 🔨 Build & Integration Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: nexerp-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: nexerp-frontend:test
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3001
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🚀 Start Backend + Integration Test
        run: |
          # Gunakan --network host agar bisa akses PostgreSQL service di localhost
          docker run -d --name nexerp-backend-test \
            --network host \
            -e PORT=3001 \
            -e NODE_ENV=production \
            -e DATABASE_URL="postgresql://test_user:test_pass@localhost:5432/test_db?schema=public" \
            -e JWT_SECRET="test-secret-do-not-use-in-production" \
            -e AES_SECRET_KEY="aureon_erp_v4_ultra_secret_key_32" \
            -e CORS_ORIGIN="http://localhost:3000,https://nexerp.id" \
            nexerp-backend:test

          # Tunggu sampai siap (max 60 detik)
          echo "⏳ Menunggu backend siap..."
          for i in $(seq 1 60); do
            sleep 2
            HEALTH=$(curl -sf http://localhost:3001/health 2>/dev/null || echo "")
            if [ -n "$HEALTH" ]; then
              echo "✅ Backend siap setelah ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "❌ Backend gagal start!"
              docker logs nexerp-backend-test --tail 50
              exit 1
            fi
          done

      - name: 🩺 Jalankan Integration Tests
        run: |
          chmod +x scripts/test-deploy.sh
          bash scripts/test-deploy.sh http://localhost:3001

      - name: 📝 Logs jika gagal
        if: failure()
        run: docker logs nexerp-backend-test --tail 100

      - name: 🧹 Bersihkan
        if: always()
        run: docker rm -f nexerp-backend-test 2>/dev/null || true

  # ═══════════════════════════════════════════════════════════
  #  PHASE 2: PUSH IMAGES KE GITHUB CONTAINER REGISTRY
  # ═══════════════════════════════════════════════════════════
  push-images:
    name: 📤 Push to GHCR
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Generate Tags
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          echo "date=$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: 📦 Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE_BACKEND }}:${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📦 Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE_FRONTEND }}:${{ steps.meta.outputs.date }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ secrets.DOMAIN_NAME }}/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════════
  #  PHASE 3: DEPLOY KE STAGING (test dulu di port beda)
  # ═══════════════════════════════════════════════════════════
  deploy-staging:
    name: 🧪 Deploy to Staging
    needs: push-images
    runs-on: ubuntu-latest
    environment: staging
    if: ${{ !github.event.inputs.skip_staging }}
    steps:
      - name: 🔑 Setup SSH
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
          if_agent: false

      - name: 🚀 Deploy ke Staging
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "=== 🟡 STAGING DEPLOY ==="
            cd /opt/nexerp

            # Login GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull image terbaru
            docker pull ${{ env.IMAGE_BACKEND }}:latest
            docker pull ${{ env.IMAGE_FRONTEND }}:latest

            # Deploy dengan project name berbeda (port 3003)
            export COMPOSE_PROJECT_NAME=nexerp-staging
            docker compose -f docker-compose.staging.yml up -d --force-recreate

            # Test staging
            echo "⏳ Test staging..."
            for i in $(seq 1 30); do
              sleep 2
              curl -sf http://localhost:3003/health && echo "✅ Staging OK" && break
            done

      - name: ⏳ Grace Period (5 menit untuk cancel)
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════"
          echo "  🟢 STAGING IS LIVE at port 3003"
          echo "  ✅ Integration tests passed di CI"
          echo ""
          echo "  🔜 Production deploy in 5 minutes..."
          echo "     Cancel here if issues:"
          echo "     https://github.com/${{ github.repository }}/actions"
          echo "═══════════════════════════════════════════════════"
          sleep 300

  # ═══════════════════════════════════════════════════════════
  #  PHASE 4: DEPLOY KE PRODUCTION (dengan rollback safety)
  # ═══════════════════════════════════════════════════════════
  deploy-production:
    name: 🌍 Deploy to Production
    needs: [push-images, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    if: ${{ always() && !failure() && !cancelled() }}
    steps:
      - name: 🔑 Setup SSH
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
          if_agent: false

      - name: 📄 Copy config files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "./docker-compose.prod.yml,./nginx.conf"
          target: "/opt/nexerp"

      - name: 🚀 Deploy ke Production
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            echo "═══════════════════════════════════════════════════"
            echo "  🔴 NEXERP PRODUCTION DEPLOY"
            echo "  $(date)"
            echo "═══════════════════════════════════════════════════"

            cd /opt/nexerp

            # ── 1. Login GHCR ──
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # ── 2. Backup Database ──
            echo "📦 Backing up database..."
            mkdir -p backups
            DB_CONTAINER=$(docker ps --format '{{.Names}}' | grep -i 'db\|postgres' | head -1 || echo "")
            if [ -n "$DB_CONTAINER" ]; then
              BACKUP_FILE="backups/pre-deploy-$(date +%Y%m%d-%H%M%S).sql"
              docker exec "$DB_CONTAINER" pg_dump \
                -U "${{ secrets.DB_USER }}" \
                "${{ secrets.DB_NAME }}" \
                > "$BACKUP_FILE" 2>/dev/null && \
                echo "✅ DB backed up ($(wc -c < "$BACKUP_FILE") bytes)" || \
                echo "⚠️  DB backup skipped"
            else
              echo "⚠️  No DB container found"
            fi

            # ── 3. Simpan versi lama untuk rollback ──
            docker tag ${{ env.IMAGE_BACKEND }}:latest ${{ env.IMAGE_BACKEND }}:previous 2>/dev/null || true
            docker tag ${{ env.IMAGE_FRONTEND }}:latest ${{ env.IMAGE_FRONTEND }}:previous 2>/dev/null || true

            # ── 4. Pull & Deploy ──
            docker pull ${{ env.IMAGE_BACKEND }}:latest
            docker pull ${{ env.IMAGE_FRONTEND }}:latest
            docker compose -f docker-compose.prod.yml up -d --force-recreate

            # ── 5. Health Check (max 60 detik) ──
            echo "⏳ Health check..."
            HEALTHY=false
            for i in $(seq 1 30); do
              sleep 2
              HEALTH=$(curl -sf http://localhost:3001/health 2>/dev/null || echo "FAIL")
              if [ "$HEALTH" != "FAIL" ]; then
                HEALTHY=true
                echo "✅ Health check passed!"
                break
              fi
            done

            # ── 6. Rollback jika health check gagal ──
            if [ "$HEALTHY" != "true" ]; then
              echo "❌ Health FAILED! Rolling back..."
              docker compose -f docker-compose.prod.yml logs --tail 30
              docker compose -f docker-compose.prod.yml down
              docker tag ${{ env.IMAGE_BACKEND }}:previous ${{ env.IMAGE_BACKEND }}:latest 2>/dev/null || true
              docker tag ${{ env.IMAGE_FRONTEND }}:previous ${{ env.IMAGE_FRONTEND }}:latest 2>/dev/null || true
              docker compose -f docker-compose.prod.yml up -d
              echo "❌ DEPLOY ROLLED BACK to previous version"
              exit 1
            fi

            # ── 7. Smoke Test ──
            echo "🔍 Smoke tests..."
            bash /opt/nexerp/scripts/test-deploy.sh http://localhost:3001 2>/dev/null || echo "⚠️  Smoke test warning"

            # ── 8. Cleanup ──
            docker image prune -f --filter "until=24h" 2>/dev/null || true
            ls -t backups/*.sql 2>/dev/null | tail -n +4 | xargs rm -f 2>/dev/null || true

            echo ""
            echo "═══════════════════════════════════════════════════"
            echo "  ✅ DEPLOY SUCCESSFUL!"
            echo "  📅 $(date)"
            echo "  🖼️  Backend: ${{ env.IMAGE_BACKEND }}:latest"
            echo "  🖼️  Frontend: ${{ env.IMAGE_FRONTEND }}:latest"
            echo "  ↩️  Rollback: docker tag ...:previous ...:latest"
            echo "═══════════════════════════════════════════════════"
