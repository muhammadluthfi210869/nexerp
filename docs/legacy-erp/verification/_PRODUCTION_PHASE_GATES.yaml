  - {id: P18, name: Reporting executive analytics and KPI governance, status: NOT_STARTED, depends_on: [P17], required_gates: [every published metric reconciles to transactional truth], required_tests: [report_reconciliation, filter_timezone, drilldown, export_parity, row_level_access, cache_freshness, large_data_performance]}
  - {id: P19, name: Strict DNA migration UI UX frontend consolidation and accessibility, status: NOT_STARTED, depends_on: [P18], required_gates: [100 percent canonical and approved extension screens have DNA evidence, all UI primitives import only from @/components/dna, canonical visual and golden routes render real DNA exports, all DNA static and rendered thresholds pass, WCAG AA met, lint zero errors and warnings, no unexplained orphan duplicate primitive or production mock fallback], required_tests: [route_component_store_inventory, dna_import_boundary_ast, dna_native_interactive_scan, dna_primitive_duplication_scan, dna_hardcoded_visual_scan, dna_barrel_integrity, dna_reference_route_and_composition, dna_screen_coverage_manifest, dna_exception_registry_validation, frontend_unused_orphan_scan, api_client_duplication_scan, visual_regression, axe, keyboard_focus, screen_reader_sample, responsive_matrix, browser_matrix, ui_state_matrix]}
  - {id: P20, name: System-wide maintainability verification and resilience, status: NOT_STARTED, depends_on: [P19], required_gates: [all required suites pass, all architecture maintainability and UI DNA thresholds pass, security and performance thresholds met, zero P0 or P1], required_tests: [full_unit, full_integration, full_contract, full_e2e, golden_threads, full_architecture_fitness, full_dependency_graph, full_unused_orphan_duplicate_scan, full_dna_compliance_scan, full_dna_rendered_matrix, changed_complexity_check, critical_logic_mutation_sample, sast, dependency_scan, container_scan, dast, load_soak, chaos_retry, memory_leak]}
  - {id: P21, name: Migration change delivery operations cutover and DR rehearsal, status: NOT_STARTED, depends_on: [P20], required_gates: [two identical clean migration rehearsals, all five change archetypes pass without unexplained unrelated-domain edits, zero unexplained data delta, backward compatibility and deploy reversal proven, RPO and RTO met], required_tests: [migration_rehearsal_1, migration_rehearsal_2, persisted_field_change_rehearsal, business_rule_workflow_change_rehearsal, ui_api_change_rehearsal, report_kpi_change_rehearsal, integration_event_change_rehearsal, old_new_version_coexistence, control_totals, file_transfer, backup_restore, rollback_rollforward, alert_drill, deploy_smoke, runbook_simulation]}
  - {id: P22, name: Independent pre-UAT DNA and maintainability certification, status: NOT_STARTED, depends_on: [P21], required_gates: [fresh clean-room pass of every permanent threshold, independent architecture lifecycle and DNA source/render audit, 100 percent per-screen DNA evidence accepted, change rehearsal evidence accepted, immutable release candidate, complete UAT pack, technical READY_FOR_UAT certificate], required_tests: [clean_room_full_gate, independent_dependency_graph_audit, lifecycle_registry_sampling, architecture_exception_audit, independent_dna_source_sampling, independent_dna_rendered_sampling, dna_exception_audit, change_rehearsal_evidence_audit, traceability_sampling, evidence_audit, uat_role_data_script_validation, go_no_go_review]}
