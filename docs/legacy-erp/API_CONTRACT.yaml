components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: |
        UUID v4 for idempotency. Required for all POST on /finance/*,
        /scm/purchase*, /commercial/*, /warehouse/inbounds, /legality/audits.
      schema:
        type: string
        format: uuid

  schemas:
    ProblemDetails:
      type: object
      description: RFC 7807 Problem Details for HTTP APIs
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        traceId: { type: string }
        context: { type: object, additionalProperties: true }
    ApiResponse:
      type: object
      properties:
        data: {}
        meta:
          type: object
          properties:
            page: { type: integer }
            pageSize: { type: integer }
            total: { type: integer }
    Id:
      type: string
      format: uuid
    Pagination:
      type: object
      properties:
        page: { type: integer, default: 1 }
        pageSize: { type: integer, default: 20, maximum: 100 }

  responses:
    BadRequest:
      description: Bad request - validation error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Unauthorized - missing or invalid JWT
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Forbidden - authenticated but lacks required role
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServerError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

# APPENDIX A: Tier 2 Stubs (142 GET operations, 142 paths)
# All GETs stubbed with x-stub: true. Expand by reading controller file.

# APPENDIX B: Tier 3 Out-of-Scope
# - /health, /ready, /metrics (Prometheus)
# - /_internal/cron/* (scheduled jobs)
# - /_dev/seed-data (dev only)
# - /auth/login, /auth/refresh (separate /auth controller)
# - marketing/* (excluded per ADR-002)
# - dashboard/*, executive/*, my-dashboard/* (excluded per NEX ERP scope)

# APPENDIX C: Idempotency Policy
# All POST on these modules REQUIRE Idempotency-Key header:
# - /finance/* (93 mutations)
# - /scm/* (10 mutations)
# - /commercial/* (4 mutations)
# - /warehouse/* (14 mutations)
# - /legality/* (16 mutations)
