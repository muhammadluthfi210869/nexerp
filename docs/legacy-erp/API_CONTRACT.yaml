openapi: 3.0.3
info:
  title: NEX ERP API Contract
  version: 0.3.0
  description: |
    Regenerated from live backend NestJS controllers via swagger-spec.json.
    Authority: AUTHORITY-4 (transport/schema only). Business semantics:
    docs/legacy-erp/NEX_ERP_MASTER_SPECIFICATION.md (AUTHORITY-2).

    Coverage (this revision):
    - 809 paths / 999 operations
      grouped by 11 business functions per ADR-002 hybrid route map.
    - All $ref schemas from live swagger included so tooling resolves.

    LOCKED decisions (docs/ssot/00_AUTHORITY_HIERARCHY.md §10):
    - D-001: GLOBAL document code sequence
    - D-002: 4-state inventory (good, reject, free, bad)

    Custom extensions:
    - x-business-function: ADR-002 hybrid function (samples/penjualan/etc.)
    - x-source: swagger-spec (regenerated marker)
    - x-source-version: backend swagger version (4.0)

    KNOWN ISSUES:
    - 252 paths duplicated as /v1/v1/* (real backend bug, dual global prefix).
      Spec preserved verbatim so it matches reality.
    - Operation summaries derived from operationId when controller omitted @ApiOperation.
    - x-roles / x-idempotent / x-source-file NOT regenerated (require
      controller source parsing — out of scope for this regen).

    Generated: 2026-09-12 (v0.3.0)
servers:
  - url: http://localhost:3001/v1
    description: Local dev
  - url: https://erp.dreamlab.id/v1
    description: Production

