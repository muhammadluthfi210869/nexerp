openapi: 3.0.3
info:
  title: NEX ERP API Contract
  version: 0.2.0
  description: |
    Rebuilt from real backend NestJS controllers, not screen catalog.
    Authority: AUTHORITY-4 (transport/schema only). Business semantics:
    docs/legacy-erp/NEX_ERP_MASTER_SPECIFICATION.md (AUTHORITY-2).

    Coverage:
    - Tier 1 (fully documented): 137 critical mutations
      across finance, scm, commercial, warehouse, legality, system.
    - Tier 2 (stubbed): 142 GET operations across 9 modules.

    LOCKED decisions (docs/ssot/00_AUTHORITY_HIERARCHY.md §10):
    - D-001: GLOBAL document code sequence
    - D-002: 4-state inventory (good, reject, free, bad)

    Custom extensions: x-roles, x-idempotent, x-source-file.

    Generated: 2026-09-11 (v0.2.0)
servers:
  - url: http://localhost:3001/v1
    description: Local dev
  - url: https://erp.dreamlab.id/v1
    description: Production

tags:
  - name: finance
    description: Finance (AP/AR, journals, period locks, taxes, assets)
  - name: scm
    description: Supply Chain (PO, inbound, materials, suppliers)
  - name: commercial
    description: Sales, invoicing, retention, payments
  - name: warehouse
    description: Warehouse (inbound, outbound, transfers, stock)
  - name: hr
    description: Human Resources
  - name: legality
    description: Legal compliance
  - name: system
    description: System endpoints
  - name: master
    description: Master data
  - name: production
    description: Production planning & execution

security:
  - bearerAuth: []

