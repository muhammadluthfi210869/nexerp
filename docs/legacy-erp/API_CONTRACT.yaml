# ============================================================================
# APPENDIX A: Hybrid Function Route Map (ADR-002)
# ============================================================================
# 11 business functions consume this contract:
# - /finance         AP/AR, journals, period locks, taxes, assets, job costing
# - /penjualan       Sales (bussdev, commercial, sales-orders, invoices)
# - /pembelian       Procurement (scm, PO, inbounds, materials, suppliers)
# - /inventory       Warehouse (inbound, outbound, transfers, stock)
# - /production      Production planning & execution (step logs, machines)
# - /quality         QC (workbench, audits, defect analytics)
# - /samples         R&D (formulas, formulations, NPF, samples)
# - /master          Master data (materials, suppliers, warehouses, HR, legality)
# - /exec            Executive analytics (analytics, dashboard, alerts)
# - /crm             Marketing + CRM (tasks, content assets, lead capture, omni-crm)
# - /auth            Authentication (login, profile, refresh)
# - /cross-cutting   Notifications, system, uploads, webhooks, events
# Detailed route mapping: docs/legacy-erp/backend/route-mapping-hybrid.json (176 screens).
#
# ============================================================================
# APPENDIX B: Idempotency Policy
# ============================================================================
# POST on these modules REQUIRE Idempotency-Key header (UUID v4):
# - /finance/* (all financial mutations)
# - /pembelian/scm/* (purchase orders, inbounds, returns, payments)
# - /penjualan/commercial/* (sales orders, invoices, payments)
# - /inventory/warehouse/* (inbounds, adjustments)
# - /quality/legality/audits
# See: backend/src/common/interceptors/idempotency.interceptor.ts
#
# ============================================================================
# APPENDIX C: Out-of-Scope Endpoints (mounted by backend, not documented here)
# ============================================================================
# - /health, /ready, /metrics (Prometheus — K8s probes)
# - /_internal/cron/* (scheduled jobs)
# - /_dev/seed-data (dev only)
# See: backend/src/health/, backend/src/cron/, backend/src/dev/
