<script>
	$(function() {
		$("#toogle_password").on('click', function(event) {
			event.preventDefault();
			if ($('#show_hide_password input').attr("type") == "text") {
				$('#show_hide_password input').attr('type', 'password');
				$('#show_hide_password i').addClass("fa-eye-slash");
				$('#show_hide_password i').removeClass("fa-eye");
			} else if ($('#show_hide_password input').attr("type") == "password") {
				$('#show_hide_password input').attr('type', 'text');
				$('#show_hide_password i').removeClass("fa-eye-slash");
				$('#show_hide_password i').addClass("fa-eye");
			}
		});
		$.validator.addMethod("strong_password", function(value, element) {
			let password = value;
			if (!(/^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[@#$%&])(.{8,20}$)/.test(password))) {
				return false;
			}
			return true;
		}, function(value, element) {
			let password = $(element).val();
			if (!(/^(.{8,20}$)/.test(password))) {
				return 'Kata sandi harus antara 8 hingga 20 karakter.';
			} else if (!(/^(?=.*[A-Z])/.test(password))) {
				return 'Kata sandi harus mengandung setidaknya satu huruf besar.';
			} else if (!(/^(?=.*[a-z])/.test(password))) {
				return 'Kata sandi harus mengandung setidaknya satu huruf kecil.';
			} else if (!(/^(?=.*[0-9])/.test(password))) {
				return 'Kata sandi harus mengandung setidaknya satu angka.';
			} else if (!(/^(?=.*[@#$%&])/.test(password))) {
				return "Kata sandi harus berisi karakter khusus dari @#$%&.";
			}
			return false;
		});
		$.validator.setDefaults({
			submitHandler: function(form) {

									$('#cardLoading').show();
					form.submit();
							}
		});
		$('#GSForm').validate({
			rules: {
				email: {
					required: true,
					email: true
				},
				password: {
					required: true,
					strong_password: false,
				},
				password_confirm: {
					required: true,
					equalTo: "#password"
				}
			},
			errorElement: 'span',
			errorPlacement: function(error, element) {
				error.addClass('invalid-feedback');
				element.closest('.form-group').append(error);
			},
			highlight: function(element, errorClass, validClass) {
				$(element).addClass('is-invalid');
			},
			unhighlight: function(element, errorClass, validClass) {
				$(element).removeClass('is-invalid');
			}
		});
	});
