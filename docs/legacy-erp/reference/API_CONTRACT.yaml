openapi: 3.0.3
info:
  title: NEX ERP API Contract
  version: 0.1.1
  description: |
    First-cut API contract generated from NEX_ERP_SCREEN_AND_API_CATALOG.json v2.0.0.
    Covers critical business flows: PO Inbound, SO Pipeline, Closing Period, Escrow,
    Approval Workflow, Master Data (representative), Dashboard & Report (representative).

    Documented endpoints: 49 (representative first-cut)
    Actual backend endpoints: ~686 (per scan 2026-09-11, includes Phase 2 finance stubs)

    Source catalog: docs/legacy-erp/NEX_ERP_SCREEN_AND_API_CATALOG.json (176 screens)
    Generated: 2026-09-10T07:07:38.224Z
    Last updated: 2026-09-11 (v0.1.1 — Phase 2 marker, coverage gap noted)

    NOTE: This is a STARTING POINT. Each endpoint should be reviewed against:
    - specialRequirementsNotes in JSON catalog (full text)
    - master spec NEX_ERP_MASTER_SPECIFICATION.md
    - existing backend NestJS controllers
    - ADR decisions (ADR-001 through ADR-015)

    COVERAGE GAP (as of 2026-09-11):
    - Phase 2 finance stubs (~112 endpoints across DownPayment, APPayment, ARReceipt,
      journal automation, auto-posting, period management) NOT yet documented here.
    - Update path: scan backend/src/modules/finance/**/*.controller.ts, extract
      @Get/@Post/@Put/@Patch/@Delete decorators, generate OpenAPI operations.
    - Target: v0.2 with 161+ endpoints covering critical finance flows.
    
servers:
  - url: https://nexerp.id
    description: Production
  - url: http://localhost:3000
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: mod-01
    description: MOD-01 Master Data Management (107 screens)
  - name: mod-02
    description: MOD-02 BusDev & CRM (12 screens)
  - name: mod-03
    description: MOD-03 R&D & Formulation (8 screens)
  - name: mod-04
    description: MOD-04 SCM & Purchasing (25 screens)
  - name: mod-05
    description: MOD-05 Warehouse & Inventory (4 screens)
  - name: mod-07
    description: MOD-07 QC & Compliance (7 screens)
  - name: mod-12
    description: MOD-12 Executive & Analytics (13 screens)

