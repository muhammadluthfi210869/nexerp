components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        default: 25
        maximum: 100
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    ApiResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          description: Response payload (varies per endpoint)
        meta:
          type: object
          properties:
            page:
              type: integer
            pageSize:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer
          description: RFC 7807 envelope (per memory: api_envelope)

    CreateOrUpdateRequest:
      type: object
      additionalProperties: true
      description: |
        Request body shape varies per endpoint. See JSON catalog screen.formInputs[]
        for the specific fields. Use camelCase per memory naming_convention.
        Code prefixes use Universal Code Engine (ADR-003):
        - Format lengkap: DL-{DIV}-{TYPE}-{DDMMYYYY}-{seq}
        - Format ringkas: {TYPE}-{DDMMYYYY}-{seq}
        - Sequence GLOBAL, no reset per memory

    ProblemDetails:
      type: object
      description: RFC 7807 Problem Details for HTTP APIs
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        traceId:
          type: string
        context:
          type: object
          additionalProperties: true

  responses:
    BadRequest:
      description: Bad request - validation error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Unauthorized - missing or invalid JWT
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServerError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
