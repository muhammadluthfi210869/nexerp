version: 1.0
effective_date: 2026-09-16
status: PROVISIONAL
authority_map: 00_MASTER_SPEC.md#91-canonical-subject-based-authority-map
companion_docs:
  - 01_DOMAIN_MODEL.md          # semantic entity catalog; physical count generated from schema
  - 07_RBAC_MATRIX.yaml         # role × module × action × data_scope
  - 09_NON_FUNCTIONAL_CONTRACT.md  # §5 soft-delete, §6 audit, §7 auth
  - NEX_FINANCE_FINAL_SPEC.md   # auto-journal rules
  - _SSOT_AUTH.md               # auth + RBAC decisions
  - _SSOT_COMMUNICATION.md      # per-entity notes / status transitions

overview: |
  Defines authoritative owner per entity (module + role), readers (which roles
  can see), and special readers (with data scope filter).

  Rules:
  1. Each entity has ONE authoritative writer module. Within that module, a
     primary role holds the default writer rights; staff-level roles inherit
     write within the module (per 07_RBAC_MATRIX.yaml hierarchy).
  2. Other modules can READ the data but NOT write. Reading is gated by the
     role × module × action matrix in 07_RBAC_MATRIX.yaml.
  3. Cross-module writes happen via explicit delegation in this document
     (cross_module_writes + delegations) OR via integration events in
     08_INTEGRATION_EVENT_CONTRACT.yaml. Direct write from a non-owner
     module is FORBIDDEN.
  4. Soft-delete + audit on all writes (per 09_NON_FUNCTIONAL_CONTRACT §5-6).
  5. data_scope on each reader follows 07_RBAC_MATRIX.yaml data_scopes:
     all | own_only | division_only | warehouse_only | created_by_only.
  6. CHILD entities (per DEC-016: GoodsReceipt, PurchaseInvoice, SalesInvoice)
     have NO standalone create endpoint — they are created from a parent
     detail page by a delegated action.
  7. BRIDGE entities (per DEC-017: BatchRecord) carry the parent FK forward
     and are created from the parent SO via delegation.

# ===========================================
# 1. MASTER DATA OWNERSHIP (count generated by validator)
# ===========================================
master_data:
  - entity: Organization
    authoritative_writer:
      module: auth
      primary_role: SuperAdmin
    readers:
      all: [SuperAdmin, Administrator, Auditor]
    deletable_by: [SuperAdmin]
    notes: Tenant root. One row per tenant. Created at onboarding.

  - entity: Role
    authoritative_writer:
      module: auth
      primary_role: SuperAdmin
    readers:
      all: [SuperAdmin, Administrator, HRAdmin, Auditor]
    deletable_by: [SuperAdmin]
    audit_required: true
    notes: is_system roles protected from edit (DEC-024). Legacy 16 roles preserved.

  - entity: Permission
    authoritative_writer:
      module: auth
      primary_role: SuperAdmin
    readers:
      all: [SuperAdmin, Administrator, Auditor]
    audit_required: true
    notes: 86 permission slugs (77 legacy + 9 NEX new). kebab-case canonical (DEC-024).

  - entity: RolePermission
    authoritative_writer:
      module: auth
      primary_role: SuperAdmin
    readers:
      all: [SuperAdmin, Administrator, Auditor]
    mutation_interface: role-permission service transaction
    cross_module_write_policy: forbidden
    audit_required: true
    notes: Technical association table; mutations are owned by the RBAC service and must be applied atomically with role audit records.

  - entity: User
    authoritative_writer:
      module: auth
      primary_role: HRAdmin
      primary_role_alternates: [Administrator]
    readers:
      all: [HRAdmin, HRStaff, Administrator, SuperAdmin, Executive, Auditor]
      with_data_scope:
        - role: HRStaff
          scope: division_only
    deletable_by: [SuperAdmin]
    audit_required: true
    sensitive: true   # PII per UU PDP
    notes: |
      HRAdmin creates new users. Legacy 45 users force-reset on first login
      (DEC-022). UserSession + AuditLog tied via userId.

  - entity: Division
    authoritative_writer:
      module: auth
      primary_role: SuperAdmin
      primary_role_alternates: [HRAdmin]
    readers:
      all: [HRAdmin, Executive, Auditor]
    deletable_by: [SuperAdmin]

  - entity: Customer / CustomerCategory
    authoritative_writer:
      module: busdev
      primary_role: BusDevAdmin
      fallback_role: BusDevStaff   # owner-scoped writes only
    readers:
      all: [BusDevManager, BusDevAdmin, BusDevStaff, Executive, Auditor, FinanceManager, FinanceAdmin, FinanceStaff]
      with_data_scope:
        - role: BusDevStaff
          scope: own_only          # customer.ownerUserId == self
        - role: DigitalMarketingStaff
          scope: all               # read for campaign use
    deletable_by: [BusDevAdmin, DigitalMarketingAdmin, SuperAdmin]
    audit_required: true
    notes: |
      Customer is BUSDEV-owned. Finance reads credit_limit + payment_term to
      enforce AR delivery gatekeeper (NFR-Finance §3.2). NO direct write from
      finance module.

  - entity: Supplier / SupplierCategory
    authoritative_writer:
      module: scm
      primary_role: PurchasingAdmin
      fallback_role: PurchasingStaff
    readers:
      all: [PurchasingAdmin, PurchasingStaff, FinanceManager, FinanceAdmin, FinanceStaff, Executive, Auditor, WarehouseAdmin]
    deletable_by: [PurchasingAdmin, SuperAdmin]
    audit_required: true
    notes: 4-pillar categories (Bahan Baku, Kemasan Primer, Kemasan Sekunder, Bahan Pembantu).

  - entity: Goods / GoodsCategory
    authoritative_writer:
      module: scm
      primary_role: PurchasingAdmin
      fallback_role: WarehouseAdmin    # can create/update goods in stock
    readers:
      all: [PurchasingStaff, ProductionAdmin, ProductionOperatorMixing, ProductionOperatorFilling, ProductionOperatorPackaging, RnDAdmin, RnDChemist, FinanceManager, FinanceAdmin, FinanceStaff, BusDevAdmin, BusDevStaff, WarehouseStaff, Executive, Auditor]
      with_data_scope:
        - role: WarehouseStaff
          scope: warehouse_only
    deletable_by: [PurchasingAdmin, WarehouseAdmin, SuperAdmin]
    audit_required: true
    notes: |
      8 COA mapping slots (coa1Id..coa8Id) used by auto-journal engine
      (NEX_FINANCE_FINAL_SPEC §1.2). Goods ownershipType controls consignment
      logic (NFR §0.6).

  - entity: Warehouse / WarehouseAccess
    authoritative_writer:
      module: warehouse
      primary_role: WarehouseAdmin
    readers:
      all: [ProductionAdmin, BusDevAdmin, FinanceManager, FinanceAdmin, Executive, Auditor]
      with_data_scope:
        - role: WarehouseStaff
          scope: warehouse_only
    deletable_by: [WarehouseAdmin, SuperAdmin]
    notes: WarehouseAccess is M:N between User and Warehouse (DEC-restricted visibility).

  - entity: Coa (Chart of Accounts)
    authoritative_writer:
      module: finance
      primary_role: FinanceAdmin
      fallback_role: FinanceStaff
    readers:
      all: [FinanceManager, FinanceAdmin, FinanceStaff, Executive, Auditor]
      special:
        - role: Auditor
          scope: read_only_all_periods
        - role: HRAdmin
          scope: read_only             # HR reads COA for payroll mapping
    deletable_by: [FinanceAdmin, SuperAdmin]
    audit_required: true
    notes: allowManualJournal=false blocks manual posting to AP/AR/WIP (NFR-Finance §1.1).

  - entity: CoaAuto (auto-journal rules)
    authoritative_writer:
      module: finance
      primary_role: FinanceAdmin
    readers:
      all: [FinanceAdmin, FinanceManager, FinanceStaff, Auditor]
    deletable_by: [FinanceAdmin, SuperAdmin]
    audit_required: true
    notes: |
      12-pair mapping per transactionEvent (FP/FJ/DPB/BPB/DPJ/BPJ/KBM/KBK/JU/
      BSP/DL/ESC). Drives the auto-journal engine (NEX_FINANCE_FINAL_SPEC §1.2).

  - entity: Formulation / FormulationAdjustment
    authoritative_writer:
      module: rnd
      primary_role: RnDAdmin
      primary_role_alternates: [RnDChemist]   # chemist edits, admin locks
    readers:
      all: [RnDManager, RnDAdmin, RnDChemist, ProductionAdmin, ProductionOperatorPackaging, BusDevAdmin, FinanceManager, Executive, Auditor, ApotekerPenanggungJawab]
    deletable_by: [RnDAdmin, SuperAdmin]
    audit_required: true
    notes: |
      LOCKED status required before BatchRecord creation. status machine:
      DRAFT → SUBMITTED → APPROVED → LOCKED. Adjustment creates new rev.

# ===========================================
# 2. SALES PIPELINE OWNERSHIP (17 entities)
# ===========================================
sales_pipeline:
  - entity: Lead / LeadDetail
    authoritative_writer:
      module: busdev
      primary_role: BusDevStaff
      fallback_role: BusDevAdmin
    readers:
      all: [BusDevManager, BusDevAdmin, Executive, Auditor, DigitalMarketingStaff]
      with_data_scope:
        - role: BusDevStaff
          scope: own_only          # lead.ownerUserId == self
    deletable_by: [BusDevAdmin, SuperAdmin]
    notes: LeadDetail M:N Lead×User (co-owners).

  - entity: SalesSample / SalesSampleApproval
    authoritative_writer:
      module: busdev
      primary_role: BusDevStaff
      fallback_role: BusDevAdmin
    readers:
      all: [BusDevManager, BusDevAdmin, BusDevStaff, RnDManager, RnDAdmin, RnDChemist, FinanceManager, FinanceAdmin, FinanceStaff, Executive, Auditor]
      with_data_scope:
        - role: BusDevStaff
          scope: own_only
    approval_role: BusDevManager   # approve per RBAC threshold
    deletable_by: [BusDevAdmin, SuperAdmin]
    notes: RnD reads to assess sample feasibility.

  - entity: SalesSamplePayment (BSP)
    authoritative_writer:
      module: finance
      primary_role: FinanceStaff
    readers:
      all: [FinanceManager, FinanceAdmin, FinanceStaff, BusDevAdmin, Executive, Auditor]
    parent_reference: SalesSample
    notes: BSP offsettable to DP Produksi (NEX_FINANCE_FINAL_SPEC §3.7).

  - entity: SalesDownPayment (DPJ)
    authoritative_writer:
      module: finance
      primary_role: FinanceStaff
    readers:
      all: [FinanceManager, FinanceAdmin, FinanceStaff, BusDevAdmin, BusDevStaff, Executive, Auditor]
    parent_reference: SalesOrder
    notes: category ∈ {SAMPLE, LEGALITAS, PRODUKSI} drives different COA flow.

  - entity: SalesOrder (SO)
    authoritative_writer:
      module: busdev
      primary_role: BusDevStaff
      approval_role: BusDevManager   # ≤ Rp 10M self, ≤ Rp 50M Manager, > Rp 50M Admin+Director
    readers:
      all: [BusDevManager, BusDevAdmin, BusDevStaff, ProductionAdmin, WarehouseAdmin, FinanceManager, FinanceAdmin, FinanceStaff, Executive, Auditor]
      with_data_scope:
        - role: BusDevStaff
          scope: own_only
    deletable_by: [BusDevAdmin, SuperAdmin]
    cross_module_writes:
      - writer: production
        operation: read_only
        field_access: [salesOrderDetail, status, formulationId, formulaLocked]
      - writer: finance
        operation: read_only
        field_access: [totalAmount, customerId, contractType, deliveryGateStatus]
      - writer: warehouse
        operation: read_only
        field_access: [deliveryGateStatus, status]   # blocks DO when HELD (NFR-Finance §3.2)
      - writer: rnd
        operation: read_only
        field_access: [formulationId, status]       # to assess feasibility
    notes: |
      SO is BRIDGE entity per DEC-017. NO direct write from production,
      finance, warehouse, or rnd modules. Production reads to know what to
      produce. Finance auto-creates invoice on user click (see cross_module_writes).

  - entity: SalesOrderDetail
    authoritative_writer:
      module: busdev
      primary_role: BusDevStaff
    readers:
      all: [BusDevAdmin, ProductionAdmin, FinanceStaff, WarehouseAdmin, Executive, Auditor]
    parent_reference: SalesOrder

  - entity: SalesOrderApproval
    authoritative_writer:
      module: busdev
      primary_role: BusDevManager
    readers:
      all: [BusDevAdmin, Executive, Auditor]
    parent_reference: SalesOrder
    notes: Approval-tier row per RBAC threshold ladder.

  - entity: SalesInvoice (FJ)  # CHILD of SO per DEC-016
    authoritative_writer:
      module: finance
      primary_role: FinanceStaff
    readers:
      all: [FinanceManager, FinanceAdmin, FinanceStaff, BusDevAdmin, BusDevStaff, Executive, Auditor]
    parent_reference: SalesOrder
    notes: |
      CHILD of SO (DEC-016). Created via button on SO detail when
      so.status == APPROVED. NO standalone /create endpoint. PPN auto-calc
      if customer.PKP (NFR-Finance §3.1).

  - entity: SalesInvoiceDetail
    authoritative_writer:
      module: finance
      primary_role: FinanceStaff
    readers:
      all: [FinanceStaff, BusDevAdmin, Executive, Auditor]
    parent_reference: SalesInvoice

  - entity: SalesPayment (BPJ / AR Receipt)
    authoritative_writer:
      module: finance
      primary_role: FinanceStaff
    readers:
      all: [FinanceManager, FinanceAdmin, FinanceStaff, BusDevManager, Executive, Auditor]
    parent_reference: SalesInvoice
    notes: pph23Deducted handled per NFR-Finance §3.4.

  - entity: SalesReturn / SalesReturnDetail / SalesReturnApproval
    authoritative_writer:
      module: busdev
      primary_role: BusDevStaff
      approval_role: BusDevManager
    readers:
      all: [BusDevAdmin, BusDevStaff, FinanceStaff, WarehouseAdmin, Executive, Auditor]
    parent_reference: SalesInvoice
    notes: availableQty must be ≤ original SO qty (cross-entity validation).

  - entity: SalesReturnIn (inbound from customer → warehouse)
    authoritative_writer:
      module: warehouse
      primary_role: WarehouseStaff
    readers:
      all: [WarehouseAdmin, BusDevAdmin, FinanceStaff, Executive, Auditor]
    parent_reference: SalesReturn
    notes: Stock auto-IN via StockMovement when posted.

  - entity: SalesTarget
    authoritative_writer:
      module: busdev
      primary_role: BusDevAdmin
    readers:
      all: [BusDevManager, BusDevAdmin, BusDevStaff, DigitalMarketingAdmin, DigitalMarketingStaff, Executive, Auditor]
      with_data_scope:
        - role: BusDevStaff
          scope: own_only
    deletable_by: [BusDevAdmin, SuperAdmin]

# ===========================================
# 3. PURCHASE PIPELINE OWNERSHIP (15 entities)
# ===========================================
purchase_pipeline:
  - entity: PurchaseRequest (PR)
    authoritative_writer:
      module: scm
      primary_role: PurchasingStaff
      any_role_can_create: [ProductionAdmin, ProductionOperatorMixing, ProductionOperatorFilling, ProductionOperatorPackaging, WarehouseAdmin, WarehouseStaff, RnDAdmin]   # DEC: anyone can raise a PR
    readers:
      all: [PurchasingAdmin, PurchasingStaff, PurchasingManager, FinanceManager, FinanceAdmin, FinanceStaff, Executive, Auditor]
    approval_role: PurchasingAdmin
    deletable_by: [PurchasingAdmin, SuperAdmin]
    notes: |
      PR is the only procurement doc open to cross-division creation. The
      approval and conversion to PO remains PurchasingAdmin-only.

  - entity: PurchaseRequestDetail
    authoritative_writer:
      module: scm
      primary_role: PurchasingStaff
    readers:
      all: [PurchasingAdmin, PurchasingStaff, Executive, Auditor]
    parent_reference: PurchaseRequest

  - entity: PurchaseRequestApproval
    authoritative_writer:
      module: scm
      primary_role: PurchasingAdmin
    readers:
      all: [PurchasingStaff, Executive, Auditor]
    parent_reference: PurchaseRequest

  - entity: PurchaseOrder (PO)
    authoritative_writer:
      module: scm
      primary_role: PurchasingStaff
      approval_role: PurchasingAdmin   # ≤ 5M staff self, ≤ 100M admin, > 100M admin+director
    readers:
      all: [PurchasingAdmin, PurchasingStaff, WarehouseAdmin, FinanceManager, FinanceAdmin, FinanceStaff, Executive, Auditor]
    deletable_by: [PurchasingAdmin, SuperAdmin]
    cross_module_writes:
      - writer: warehouse
        operation: create_gr_from_po
        condition: po.status == APPROVED AND user.action == 'create_gr'
        target_entity: GoodsReceipt
      - writer: finance
        operation: read_only
        field_access: [total, supplierId, ppnAmount, status]
      - writer: production
        operation: read_only
        field_access: [purchaseRequestId, notes]   # to plan incoming material
    notes: |
      PO is PARENT for GR and PurchaseInvoice (DEC-016). All purchase
      transactions originate from PO. date is read-only = today (REQUIREMENT
      Poin 64).

  - entity: PurchaseOrderDetail
    authoritative_writer:
      module: scm
      primary_role: PurchasingStaff
    readers:
      all: [PurchasingAdmin, PurchasingStaff, WarehouseAdmin, FinanceStaff, Executive, Auditor]
    parent_reference: PurchaseOrder

  - entity: PurchaseOrderApproval
    authoritative_writer:
      module: scm
      primary_role: PurchasingAdmin
    readers:
      all: [PurchasingStaff, Executive, Auditor]
    parent_reference: PurchaseOrder
    notes: Multi-tier approval based on PO amount (per RBAC threshold ladder).

  - entity: PurchaseDownPayment (DPB)
    authoritative_writer:
      module: finance
      primary_role: FinanceStaff
    readers:
      all: [FinanceManager, FinanceAdmin, FinanceStaff, PurchasingAdmin, Executive, Auditor]
    parent_reference: PurchaseOrder

  - entity: GoodsReceipt (GR — Pembelian Masuk)  # CHILD of PO per DEC-016
    authoritative_writer:
      module: warehouse
      primary_role: WarehouseStaff
      primary_role_alternates: [WarehouseAdmin]
    readers:
      all: [PurchasingAdmin, PurchasingStaff, WarehouseAdmin, FinanceManager, FinanceAdmin, FinanceStaff, Executive, Auditor]
    parent_reference: PurchaseOrder
    notes: |
      CHILD of PO (DEC-016). Records qtyGood + qtyReject + qtyFree per
      REQUIREMENT Poin 44 (3-pillar Bagus/Reject/Free). 4-leg matching
      driven by qtyQcPassed (NFR-Finance §2.2).

  - entity: GoodsReceiptDetail
    authoritative_writer:
      module: warehouse
      primary_role: WarehouseStaff
    readers:
      all: [WarehouseAdmin, PurchasingStaff, FinanceStaff, Executive, Auditor]
    parent_reference: GoodsReceipt

  - entity: PurchaseInvoice (FP — Faktur Pembelian)  # CHILD of PO/GR per DEC-016
    authoritative_writer:
      module: finance
      primary_role: FinanceStaff
    readers:
      all: [PurchasingAdmin, PurchasingStaff, FinanceManager, FinanceAdmin, FinanceStaff, Executive, Auditor]
    parent_reference: GoodsReceipt   # or PO
    notes: |
      CHILD of PO/GR (DEC-016). Created via button on GR detail when
      gr.status == COMPLETED. 3-way match (PO + GR + Invoice) per
      NFR-Finance §2.2. matchingStatus = MATCHED|EXCEPTION (accuracy %
      hidden per REQUIREMENT Poin 8).

  - entity: PurchaseInvoiceDetail
    authoritative_writer:
      module: finance
      primary_role: FinanceStaff
    readers:
      all: [FinanceStaff, PurchasingStaff, Executive, Auditor]
    parent_reference: PurchaseInvoice

  - entity: PurchasePayment (BPB)
    authoritative_writer:
      module: finance
      primary_role: FinanceStaff
    readers:
      all: [FinanceManager, FinanceAdmin, FinanceStaff, PurchasingAdmin, Executive, Auditor]
    parent_reference: PurchaseInvoice

  - entity: PurchaseReturn / PurchaseReturnApproval / PurchaseReturnOut
    authoritative_writer:
      module: scm
      primary_role: PurchasingStaff
      approval_role: PurchasingAdmin
    readers:
      all: [PurchasingAdmin, PurchasingStaff, WarehouseAdmin, FinanceStaff, Executive, Auditor]
    parent_reference: GoodsReceipt
    notes: auto-debit-memo (NFR-Finance §2.5). PurchaseReturnOut = outbound shipment.

# ===========================================
# 4. PRODUCTION & R&D OWNERSHIP (12 entities)
# ===========================================
production:
  - entity: BatchRecord (SPK Induk)   # BRIDGE from SO per DEC-017
    authoritative_writer:
      module: production
      primary_role: ProductionAdmin
      primary_role_alternates: [BusDevAdmin]    # can create BR from approved SO (delegation)
    readers:
      all: [ProductionAdmin, ProductionOperatorMixing, ProductionOperatorFilling, ProductionOperatorPackaging, BusDevAdmin, Executive, Auditor, RnDAdmin, ApotekerPenanggungJawab, LegalitasStaff]
    deletable_by: [ProductionAdmin, SuperAdmin]
    parent_reference: SalesOrder
    notes: |
      BR carries salesOrderId + salesOrderDetailId forward (DEC-017 bridge).
      Created from SO detail view after so.status == APPROVED. NO standalone
      /create endpoint.

  - entity: ScheduleMixing
    authoritative_writer:
      module: production
      primary_role: ProductionAdmin
    readers:
      all: [ProductionOperatorMixing, Executive, Auditor, WarehouseAdmin]
    parent_reference: BatchRecord

  - entity: ScheduleFilling
    authoritative_writer:
      module: production
      primary_role: ProductionAdmin
    readers:
      all: [ProductionOperatorFilling, Executive, Auditor]
    parent_reference: BatchRecord

  - entity: SchedulePackaging
    authoritative_writer:
      module: production
      primary_role: ProductionAdmin
    readers:
      all: [ProductionOperatorPackaging, Executive, Auditor]
    parent_reference: BatchRecord

  - entity: ProductionMixing / ProductionMixingItem
    authoritative_writer:
      module: production
      primary_role: ProductionOperatorMixing
      primary_role_alternates: [ProductionAdmin]
    readers:
      all: [ProductionAdmin, ProductionOperatorMixing, QC roles, Executive, Auditor]
    parent_reference: ScheduleMixing
    stage_lock: stage_locked_until_previous_done
    notes: |
      Stock auto-decremented when ProductionMixingItem.qtyActual is posted
      (per raw/ERP_INPUT_OUTPUT_LINEAGE §5). Sum of concentrations must be
      100.00%.

  - entity: ProductionFilling / ProductionFillingItem
    authoritative_writer:
      module: production
      primary_role: ProductionOperatorFilling
      primary_role_alternates: [ProductionAdmin]
    readers:
      all: [ProductionAdmin, ProductionOperatorFilling, QC roles, Executive, Auditor]
    parent_reference: ScheduleFilling
    stage_lock: stage_locked_until_previous_done

  - entity: ProductionPackaging / ProductionPackagingItem
    authoritative_writer:
      module: production
      primary_role: ProductionOperatorPackaging
      primary_role_alternates: [ProductionAdmin]
    readers:
      all: [ProductionAdmin, ProductionOperatorPackaging, QC roles, Executive, Auditor]
    parent_reference: SchedulePackaging
    stage_lock: stage_locked_until_previous_done
    notes: BPOM label + expiry inkjet drives label compliance.

  - entity: DeliveryOut (Surat Jalan / DO) / DeliveryOutDetail
    authoritative_writer:
      module: warehouse
      primary_role: WarehouseStaff
      primary_role_alternates: [WarehouseAdmin]
    readers:
      all: [WarehouseAdmin, BusDevAdmin, BusDevStaff, ProductionAdmin, Executive, Auditor]
    parent_reference: SalesOrder
    notes: |
      Business rule: cannot create DO if salesOrder.deliveryGateStatus == HELD
      (NFR-Finance §3.2 AR Delivery Gatekeeper). qrCode auto-generated for
      public verify (OD-23).

# ===========================================
# 5. INVENTORY OWNERSHIP (4 entities)
# ===========================================
inventory:
  - entity: StockMovement
    authoritative_writer:
      module: warehouse
      primary_role: WarehouseStaff
      auto_writers: [scm, production, finance]   # auto-created from transactions
    readers:
      all: [WarehouseAdmin, WarehouseStaff, FinanceManager, FinanceAdmin, FinanceStaff, PurchasingAdmin, Executive, Auditor]
    audit_required: true
    notes: |
      Auto-generated from GoodsReceipt, ProductionMixing/Filling/Packaging
      output, DeliveryOut, SalesReturnIn, StockOpname adjustment, transfer.
      NO manual UI entry. type ∈ {IN, OUT, TRANSFER, ADJUSTMENT, OPNAME};
      quality ∈ {GOOD, REJECT, FREE} (3-pillar).

  - entity: StockOpname / StockOpnameDetail
    authoritative_writer:
      module: warehouse
      primary_role: WarehouseAdmin
    readers:
      all: [WarehouseAdmin, WarehouseStaff, FinanceManager, FinanceAdmin, Executive, Auditor]
    approval_role: WarehouseAdmin
    notes: Variance = stockActual − stockSystem drives auto-adjustment.

  - entity: StockAdjustment  # CHILD of StockOpname
    authoritative_writer:
      module: warehouse
      primary_role: WarehouseAdmin
    readers:
      all: [FinanceManager, FinanceAdmin, Executive, Auditor]
    parent_reference: StockOpname
    notes: goods_writeoff approval ladder per RBAC threshold (≤ 1M staff, ≤ 10M admin, > 10M admin+FinanceManager).

  - entity: GoodsTransfer (between warehouses)
    authoritative_writer:
      module: warehouse
      primary_role: WarehouseStaff
    readers:
      all: [WarehouseAdmin, PurchasingAdmin, FinanceStaff, Executive, Auditor]
    notes: One TRANSFER StockMovement pair (out from src, in to dst).

# ===========================================
# 6. FINANCE OWNERSHIP (7 entities)
# ===========================================
finance:
  - entity: CashBank
    authoritative_writer:
      module: finance
      primary_role: FinanceAdmin
      fallback_role: FinanceManager
    readers:
      all: [FinanceAdmin, FinanceManager, FinanceStaff, Executive, Auditor]
    deletable_by: [FinanceAdmin, SuperAdmin]
    audit_required: true
    notes: |
      Separate from CoA — keeps operating cash position (NFR-Finance §4.1).
      glCoaId link for GL reconciliation. currentBalance updated by
      JournalEntry posting.

  - entity: JournalEntry (Jurnal Umum)
    authoritative_writer:
      module: finance
      primary_role: FinanceStaff
      auto_writer: auto_journal_engine   # auto-post from transactions
    readers:
      all: [FinanceManager, FinanceAdmin, FinanceStaff, Executive, Auditor]
    audit_required: true
    deletable_by: []    # never deleted — use REVERSED status (OD-12)
    critical: |
      sum(JournalLine.debit) MUST equal sum(JournalLine.credit) before post
      (Balanced Check invariant per legacy ERP — verified Rp 3,483,845,258.46).
      Manual JournalEntry blocked if target CoA.allowManualJournal == false
      (NFR-Finance §1.1). Period-locked months reject posts except
      isAdjustment=true JournalEntry.

  - entity: JournalLine
    authoritative_writer:
      module: finance
      primary_role: FinanceStaff
    readers:
      all: [FinanceManager, FinanceAdmin, FinanceStaff, Executive, Auditor]
    parent_reference: JournalEntry
    notes: No department/costCenter dimension (REQUIREMENT Poin 25 — Financial Dimensions eliminated, OD-18).

  - entity: TaxSetup
    authoritative_writer:
      module: finance
      primary_role: FinanceAdmin
    readers:
      all: [FinanceAdmin, FinanceManager, FinanceStaff, Executive, Auditor]
    deletable_by: [FinanceAdmin, SuperAdmin]
    notes: type ∈ {PPN, PPH21, PPH23, PPH_FINAL}. Phase 2 for tax_transactions.

  - entity: FixedAsset
    authoritative_writer:
      module: finance
      primary_role: FinanceAdmin
    readers:
      all: [FinanceManager, FinanceAdmin, FinanceStaff, Executive, Auditor]
    deletable_by: [FinanceAdmin, SuperAdmin]
    audit_required: true
    notes: |
      Phase 2 priority but entity defined in MVP. category includes
      INTANGIBLE (BPOM/Halal/ISO — OD-21). Auto-creation from
      PurchaseInvoice.sourceType=PURCHASE_INVOICE.

  - entity: Budget
    authoritative_writer:
      module: finance
      primary_role: FinanceAdmin
    readers:
      all: [FinanceManager, FinanceAdmin, FinanceStaff, Executive, Auditor]
    notes: version ∈ {DRAFT, APPROVED}.

  - entity: FundRequest (Pengajuan Dana / Cash Advance)
    authoritative_writer:
      module: finance
      primary_role: FinanceStaff   # any authenticated user can submit
    readers:
      all: [FinanceManager, FinanceAdmin, FinanceStaff, Executive, Auditor]
    notes: "3-tier approval: Head → Accounting → Director (NFR-Finance §2.6). On APPROVED, KBM journal auto-posted."

# ===========================================
# 7. AUTH (cross-cutting) OWNERSHIP (4 entities)
# ===========================================
auth:
  - entity: UserSession
    authoritative_writer:
      module: auth
      primary_role: system          # auto on login
    readers:
      all: [User, SuperAdmin, Administrator]
      with_data_scope:
        - role: User
          scope: own_only           # self.sessions
    audit_required: true
    sensitive: true
    notes: TTL 30 days. revokedAt set on logout / rotation.

  - entity: AuditLog
    authoritative_writer:
      module: auth
      primary_role: system          # auto on every state change
    readers:
      all: [SuperAdmin, Administrator, Auditor]
    audit_required: false            # this IS the audit table
    notes: |
      Per-entity, written BEFORE return success (NFR §6). Retention
      HOT 12 months → COLD 5 years → PERMANENT (financial/role/auth).

  - entity: ActivityLog
    authoritative_writer:
      module: auth
      primary_role: system
    readers:
      all: [Administrator, SuperAdmin, Executive, Auditor]
    notes: Never purged (NFR §5 exception). Mirrors legacy activity-log page.

  - entity: WarehouseAccess
    authoritative_writer:
      module: warehouse
      primary_role: WarehouseAdmin
    readers:
      all: [WarehouseAdmin, Administrator, SuperAdmin]
    parent_reference: User, Warehouse

