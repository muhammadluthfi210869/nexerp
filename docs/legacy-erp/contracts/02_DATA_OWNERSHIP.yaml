          scope: division_only
    deletable_by: [HRAdmin, SuperAdmin]
    audit_required: true
    sensitive: true   # PII per UU PDP
    notes: 1-to-1 with User (Employee.userId UNIQUE). Employee identity and KPI scope are MVP.

  - entity: EmployeeContract
    authoritative_writer:
      module: hr
      primary_role: HRAdmin
    readers:
      all: [HRAdmin, DivisionManager, Executive, Auditor]
    audit_required: true
    sensitive: true
    parent_reference: Employee

  - entity: EmployeePerformance
    authoritative_writer:
      module: kpi-engine
      primary_role: System
    readers:
      all: [Employee, HRAdmin, DivisionManager, Executive, Auditor]
    parent_reference: Employee
    audit_required: true
    notes: Period aggregate is calculated only from EmployeeKpiResult; manual score writes are forbidden.

  - entity: EmployeeRoleAssignment
    authoritative_writer:
      module: hr
      primary_role: HRAdmin
    readers:
      all: [Employee, HRAdmin, DivisionManager, Executive, Auditor]
    parent_reference: Employee
