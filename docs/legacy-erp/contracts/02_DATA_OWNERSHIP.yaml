# ===========================================
# 10. COMMUNICATION OWNERSHIP (6 entities — per _SSOT_COMMUNICATION.md)
# ===========================================
communication:
  - entity: Note
    authoritative_writer:
      module: any
      primary_role: any_authenticated_user
    readers:
      all: [per entity access]      # role-based via tagged entity's read scope
    audit_required: true
    notes: |
      Per-entity notes via polymorphic (entityType, entityId) pair.
      Tagged users get in-app + email notification.

  - entity: StatusTransition
    authoritative_writer:
      module: workflow_engine
      primary_role: system          # auto on state transitions
      manual_override: [WorkflowManager, Administrator]
    readers:
      all: [per entity access, Executive, Auditor]
    notes: SLA deadline per _SSOT_COMMUNICATION.md §3.3.

  - entity: Tag
    authoritative_writer:
      module: any
      primary_role: any_authenticated_user
    readers:
      all: [per context entity access]
    notes: type ∈ {USER, ROLE, DIVISION} × contextType ∈ {NOTE, COMMENT, TRANSITION}.

  - entity: Comment (cross-reference per DEC-013)
    authoritative_writer:
      module: any
      primary_role: any_authenticated_user
    readers:
      all: [per entity access + cross-referenced entity access]
    notes: relatedEntityType/Id links Comment on SO → BatchRecord, etc.

  - entity: Attachment
    authoritative_writer:
      module: any
      primary_role: any_authenticated_user
    readers:
      all: [per entity access]
    notes: Max 10MB (NFR §10). StorageUrl = Supabase Storage path.

  - entity: Notification
    authoritative_writer:
      module: workflow_engine
      primary_role: system          # auto from events
    readers:
      all: [recipientUserId only]
    notes: |
      type ∈ {MENTION, APPROVAL_REQUEST, SLA_WARNING, SLA_BREACH,
      STATUS_CHANGED, SYSTEM}. Never deleted (NFR §5 exception).

# ===========================================
# 11. CROSS-MODULE WRITE RULES
# ===========================================
# Authoritative list of all cross-module write operations. Any write not
# listed here is FORBIDDEN. Source: 03_WORKFLOW_STATE_MACHINE.yaml +
# NEX_FINANCE_FINAL_SPEC.md + raw/ERP_INPUT_OUTPUT_LINEAGE.md.

cross_module_writes:

  - rule: SO_APPROVED_TRIGGERS_BATCH_RECORD
    description: SO status → APPROVED unlocks BatchRecord creation (user action)
    writer_module: production
    source_entity: SalesOrder
    target_entity: BatchRecord
    condition: so.status transitions to APPROVED AND user.action == 'create_br'
    mechanism: delegation via SO detail page button
    audit_required: true
    bridge: DEC-017

  - rule: SO_APPROVED_TRIGGERS_INVOICE
    description: SO status → APPROVED allows user to create SalesInvoice (FJ)
    writer_module: finance
    source_entity: SalesOrder
    target_entity: SalesInvoice
    condition: so.status == APPROVED AND user.action == 'create_invoice'
    mechanism: delegation via SO detail page button
    parent_required: SalesOrder (DEC-016)
    audit_required: true

  - rule: PO_APPROVED_TRIGGERS_GOODS_RECEIPT
    description: PO status → APPROVED allows user to create GoodsReceipt (GR)
    writer_module: warehouse
    source_entity: PurchaseOrder
    target_entity: GoodsReceipt
    condition: po.status == APPROVED AND user.action == 'create_gr'
    mechanism: delegation via PO detail page button
    parent_required: PurchaseOrder (DEC-016)
    audit_required: true

  - rule: GR_COMPLETED_TRIGGERS_PURCHASE_INVOICE
    description: GR status → COMPLETED allows user to create PurchaseInvoice (FP)
    writer_module: finance
    source_entity: GoodsReceipt
    target_entity: PurchaseInvoice
    condition: gr.status == COMPLETED AND user.action == 'create_invoice'
    mechanism: delegation via GR detail page button
    parent_required: GoodsReceipt (DEC-016)
    audit_required: true

  - rule: PRODUCTION_OUTPUT_TRIGGERS_STOCK_MOVEMENT
    description: ProductionMixing/Filling/Packaging qtyActual posted → StockMovement (OUT) auto
    writer_module: warehouse
    source_entity: ProductionMixingItem / ProductionFillingItem / ProductionPackagingItem
    target_entity: StockMovement
    field: qtyActual
    condition: production.stage == COMPLETED
    mechanism: service hook on Production record POST
    type: OUT
    quality: GOOD
    audit_required: true
    reference: raw/ERP_INPUT_OUTPUT_LINEAGE §5

  - rule: GOODS_RECEIPT_TRIGGERS_STOCK_MOVEMENT
    description: GoodsReceiptDetail POST → StockMovement (IN) auto
    writer_module: warehouse
    source_entity: GoodsReceipt
    target_entity: StockMovement
    condition: gr.status == POSTED
    mechanism: service hook
    type: IN
    audit_required: true

  - rule: DELIVERY_OUT_TRIGGERS_STOCK_MOVEMENT
    description: DeliveryOut POST → StockMovement (OUT) auto
    writer_module: warehouse
    source_entity: DeliveryOut
    target_entity: StockMovement
    condition: do.status == DISPATCHED
    mechanism: service hook
    type: OUT
    quality: GOOD
    audit_required: true

  - rule: SALES_RETURN_IN_TRIGGERS_STOCK_MOVEMENT
    description: SalesReturnIn POST → StockMovement (IN) auto
    writer_module: warehouse
    source_entity: SalesReturnIn
    target_entity: StockMovement
    condition: sri.status == POSTED
    mechanism: service hook
    type: IN
    quality: GOOD
    audit_required: true

  - rule: STOCK_OPNAME_APPROVED_TRIGGERS_ADJUSTMENT
    description: StockOpname status → APPROVED + ADJUSTED auto-creates StockMovement per variance
    writer_module: warehouse
    source_entity: StockOpname
    target_entity: StockMovement
    condition: opname.status == ADJUSTED
    mechanism: service hook
    type: OPNAME
    audit_required: true

  - rule: TRANSACTION_TRIGGERS_AUTO_JOURNAL
    description: Every FP/FJ/DPB/BPB/DPJ/BPJ/KBM/KBK/JU/BSP/DL/ESC event auto-posts JournalEntry
    writer_module: finance
    source_entity: any transaction
    target_entity: JournalEntry
    condition: source.posted
    mechanism: CoaAuto rule lookup (NEX_FINANCE_FINAL_SPEC §1.2)
    audit_required: true
    invariant: sum(debit) == sum(credit)

  - rule: FORMULATION_LOCKED_TRIGGERS_BUSDEV_NOTIFICATION
    description: Formulation.status → LOCKED triggers notification to BusDev owner
    writer_module: crm    # via workflow_engine Notification writer
    source_entity: Formulation
    target_entity: Notification
    condition: formulation.status == LOCKED
    mechanism: StatusTransition hook
    audit_required: true

  - rule: SO_APPROVED_TRIGGERS_CHECKLIST_AUTO_CREATE
    description: SO APPROVED auto-creates Checklist with 17-stage template
    writer_module: production
    source_entity: SalesOrder
    target_entity: Checklist
    condition: so.status transitions to APPROVED
    mechanism: service hook
    audit_required: true

  - rule: QC_RECORD_PHASE_2
    description: Production stage COMPLETED triggers QC check (Phase 2)
    writer_module: qc
    source_entity: ProductionMixing / ProductionFilling / ProductionPackaging
    target_entity: QCRecord
    condition: stage.status == COMPLETED
    status: PHASE_2    # not in MVP schema yet

  - rule: SALES_GATE_KEEPER
    description: SalesInvoice with remaining > 0 keeps SO.deliveryGateStatus = HELD
    writer_module: finance
    source_entity: SalesInvoice
    target_entity: SalesOrder
    field: deliveryGateStatus
    condition: invoice.remaining > 0
    mechanism: derived view (not a write); enforces NFR-Finance §3.2
    reverse_trigger: invoice.remaining == 0 → deliveryGateStatus = RELEASED

# ===========================================
# 12. DELEGATION OVERRIDES
# ===========================================
# Explicit cross-role delegations where one role grants write to another.
# Each entry MUST have audit_required: true (NFR §6).

delegations:

  - delegator: BusDevAdmin
    delegate_to: ProductionAdmin
    scope: BatchRecord.create
    condition: source == approved SO (delegated from SO APPROVED action)
    audit_required: true
    reference: cross_module_writes SO_APPROVED_TRIGGERS_BATCH_RECORD

  - delegator: PurchasingAdmin
    delegate_to: WarehouseStaff
    scope: GoodsReceipt.create
    condition: source == approved PO (delegated from PO APPROVED action)
    audit_required: true
    reference: cross_module_writes PO_APPROVED_TRIGGERS_GOODS_RECEIPT

  - delegator: WarehouseAdmin
    delegate_to: FinanceStaff
    scope: PurchaseInvoice.create
    condition: source == completed GR (delegated from GR COMPLETED action)
    audit_required: true
    reference: cross_module_writes GR_COMPLETED_TRIGGERS_PURCHASE_INVOICE

  - delegator: FinanceAdmin
    delegate_to: BusDevAdmin
    scope: Customer.financial_fields_update
    fields: [creditLimit, paymentTerm, defaultRevenueCoaId]
    condition: "amount_below: 5_000_000"
    audit_required: true
    notes: BusDev can edit limited financial fields on small customers.

  - delegator: ProductionAdmin
    delegate_to: WarehouseAdmin
    scope: StockMovement.create
    condition: warehouse_id == delegate_warehouse_id
    audit_required: true

  - delegator: RnDAdmin
    delegate_to: RnDChemist
    scope: Formulation.update
    condition: formulation.status in {DRAFT, SUBMITTED}   # not LOCKED
    audit_required: true

  - delegator: FinanceAdmin
    delegate_to: FinanceStaff
    scope: CoaAuto.update
    condition: coaAuto.transactionEvent not in {JU, AJ}   # routine rules only
    audit_required: true

# ===========================================
# 13. DATA SENSITIVITY TIERS
# ===========================================
# Drives encryption, access logging, and UU PDP compliance (NFR §10).

data_sensitivity:

  - tier: PUBLIC
    description: No restriction, indexable in search
    entities:
      - Goods.name
      - Goods.code
      - Customer.name
      - Supplier.name
      - Formulation.code
    encryption_required: none
    access_logged: false

  - tier: INTERNAL
    description: Authenticated users only, not exposed externally
    entities:
      - Customer.email
      - Customer.phone
      - Customer.address
      - Supplier.contact
      - Supplier.phone
      - SalesOrder.code
      - PurchaseOrder.code
    encryption_required: in_transit_tls
    access_logged: true

  - tier: SENSITIVE_PII
    description: PII per UU PDP (Undang-Undang Perlindungan Data Pribadi)
    entities:
      - User.email
      - User.phone
      - User.passwordHash
      - User.mfaSecret
      - Employee.NIK
      - Employee.address
      - Employee.baseSalary
      - EmployeeContract.salary
      - Customer.npwp
      - Supplier.npwp
      - UserSession.refreshTokenHash
    encryption_required: at_rest_column_level   # AES-256-GCM per NFR §7
    access_logged: true
    retention_rules:
      - entity: User.passwordHash
        rehash_on_login: true
      - entity: User.mfaSecret
        never_logged: true
      - entity: UserSession.refreshTokenHash
        ttl_days: 30

  - tier: SENSITIVE_FINANCIAL
    description: Audit-required financial data
    entities:
      - JournalEntry
      - JournalLine
      - SalesInvoice
      - SalesPayment
      - PurchaseInvoice
      - PurchasePayment
      - SalesDownPayment
      - PurchaseDownPayment
      - CashBank
      - FixedAsset
      - Budget
      - FundRequest
    encryption_required: at_rest
    access_logged: true
    audit_required: true
    retention_tier: PERMANENT

  - tier: SENSITIVE_FORMULATION
    description: Trade-secret formulation data
    entities:
      - Formulation.concentration
      - FormulationAdjustment.netto
    encryption_required: at_rest_column_level
    access_logged: true
    reader_restriction: [RnDManager, RnDAdmin, RnDChemist, ProductionAdmin, ApotekerPenanggungJawab, Executive, Auditor]

