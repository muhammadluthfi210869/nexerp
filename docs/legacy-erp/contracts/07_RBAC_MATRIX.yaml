# =====================================
# DATA SCOPES
# =====================================
# Scope = SQL-level filter applied to queries. Backend guards enforce.

data_scopes:
  - name: all
    description: All records in module (no filter)
    filter_sql: null
    implementation: passthrough

  - name: own_only
    description: Only records owned by current user
    filter_sql: "ownerUserId = :currentUserId"
    implementation: where-clause injection

  - name: division_only
    description: Only records in same division as current user
    filter_sql: "divisionId = :currentUserDivisionId"
    implementation: where-clause injection

  - name: warehouse_only
    description: Only records in warehouses user has access to
    filter_sql: "warehouseId IN (:userAccessibleWarehouseIds)"
    implementation: where-clause injection (sub-query on user_warehouse_access)

  - name: created_by_only
    description: Only records created by current user
    filter_sql: "createdByUserId = :currentUserId"
    implementation: where-clause injection

