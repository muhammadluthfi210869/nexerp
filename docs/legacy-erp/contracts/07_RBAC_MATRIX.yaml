  - id: role-nex-super-admin
    legacy_id: null
    name: SuperAdmin
    description: NEX root — full system access, can manage roles and impersonate
    is_system: true
    category: super_admin
    division: null
    inherits_from: []
    permissions:
      - module: '*'
        actions: [read, create, update, delete, approve, export, import]
        data_scope: all

