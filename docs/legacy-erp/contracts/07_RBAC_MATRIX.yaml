# =====================================================
# 07 — RBAC MATRIX (Role × Module × Action × Data Scope)
# =====================================================
# NEX ERP — Authoritative permission configuration
# Consumed by: NestJS backend guards (mandatory) + Next.js frontend UI hide/show (cosmetic)
# Migration source: kil.gserp.id legacy crawl 2026-09-16 (45 users × 16 roles × 77 permissions)
#
# Authority: access/action semantics are owned here per 00_MASTER_SPEC.md §9.1.
# Status: PROVISIONAL — certification blockers remain documented in verification reports.

version: 1.0
effective_date: 2026-09-16
status: PROVISIONAL
authority_map: 00_MASTER_SPEC.md#91-canonical-subject-based-authority-map
migration_source: kil.gserp.id (16 legacy roles, 77 permissions preserved as canonical slugs)
deprecation_note: |
  Legacy role IDs 1-16 preserved in Role.legacyId / User.legacyRoleId for traceability (DEC-025).
  Legacy kebab-case permission slugs preserved verbatim (DEC-024, DEC-026).
  NEX uses UUID primary keys (DEC-001).
  Role 10 (Production Mixing & Filling) is ORPHAN with 0 users and is NOT migrated (DEC-023).

actions:
  - read
  - create
  - update
  - delete
  - approve
  - export
  - import

# =====================================
# ROLES (generated count; run scripts/ssot/validate_ssot.js)
# =====================================
# Format:
#   id:        stable UUID-equivalent identifier (deterministic per legacyId)
#   legacy_id: legacy kil.gserp.id role id (null if NEX-only)
#   name:      human-readable name (used in matrix / UI)
#   category:  super_admin | admin | division_role | cross_cutting | legacy_combo
#   division:  which division (hr | scm | warehouse | busdev | rnd | production |
#              finance | marketing | legalitas | null)
#   permissions: per-module action list + data scope (granularity)

roles:

