# =====================================
# PERMISSIONS (77 legacy + NEX cross-cutting permissions; generated count is authoritative)
# =====================================
# Format: slug → { module, action, description, legacy }
# Slugs are canonical keys — never rename. Add new ones, keep old ones (DEC-024).

permissions:

  # ---------- 55 LEGACY SUB-MODULES ----------
  - { slug: role-manage,            module: auth,         action: 'crud', description: Manage roles and their permissions }
  - { slug: user-manage,            module: auth,         action: 'crud', description: Manage user accounts (create/update/disable) }
  - { slug: coa-manage,             module: finance,      action: 'crud', description: Manage Chart of Accounts (master) }
  - { slug: coa-auto-manage,        module: finance,      action: 'crud', description: Manage auto-journal rules (event → CoA mapping) }
  - { slug: warehouse-manage,       module: warehouse,    action: 'crud', description: Manage warehouse master (multi-location) }
  - { slug: warehouse-access-manage, module: warehouse,    action: 'crud', description: Manage warehouse access per user (bin restrictions) }
  - { slug: goods-category-manage,  module: warehouse,    action: 'crud', description: Manage goods categories }
  - { slug: goods-manage,           module: warehouse,    action: 'crud', description: Manage goods (SKU/barang) master }
  - { slug: supplier-category-manage, module: scm,        action: 'crud', description: Manage supplier categories }
  - { slug: supplier-manage,        module: scm,           action: 'crud', description: Manage vendor master }
  - { slug: customer-category-manage, module: busdev,     action: 'crud', description: Manage customer categories }
  - { slug: customer-manage,        module: busdev,        action: 'crud', description: Manage customer master (all) }
  - { slug: customer-my-manage,     module: busdev,        action: 'crud', description: Manage own customers (BusDev staff personal portfolio) }
  - { slug: sales-category,         module: busdev,        action: 'crud', description: Manage sales categories (product group taxonomy) }
  - { slug: sales-target,           module: busdev,        action: 'crud', description: Manage sales targets per period/agent }
  - { slug: purchase,               module: scm,           action: 'crud', description: Manage Purchase Orders (PO) }
  - { slug: purchase-invoice,       module: finance,      action: 'crud', description: Manage purchase invoices (AP) }
  - { slug: purchase-return,        module: scm,           action: 'crud', description: Manage purchase returns }
  - { slug: purchase-down-payment,  module: finance,      action: 'crud', description: Manage PO down payments }
  - { slug: purchase-payment,       module: finance,      action: 'crud', description: Manage PO payments (settlement) }
  - { slug: purchase-in,            module: warehouse,    action: 'crud', description: Goods receipt (inbound from PO) }
  - { slug: sales-return-in,        module: warehouse,    action: 'crud', description: Receive returned goods from sales }
  - { slug: goods-transfer,         module: warehouse,    action: 'crud', description: Transfer goods between warehouses }
  - { slug: delivery-out,           module: warehouse,    action: 'crud', description: Outbound delivery (sales fulfillment) }
  - { slug: purchase-return-out,    module: warehouse,    action: 'crud', description: Outbound for purchase return }
  - { slug: sales-sample,           module: busdev,        action: 'crud', description: Manage sales sample requests/dispatches }
  - { slug: sales-sample-payment,   module: finance,      action: 'crud', description: Manage sample payment receipts }
  - { slug: sales,                  module: busdev,        action: 'crud', description: Manage Sales Orders (SO) }
  - { slug: sales-return,           module: busdev,        action: 'crud', description: Manage sales returns }
  - { slug: sales-down-payment,     module: finance,      action: 'crud', description: Manage SO down payments }
  - { slug: sales-invoice,          module: finance,      action: 'crud', description: Manage sales invoices (AR) }
  - { slug: sales-payment,          module: finance,      action: 'crud', description: Manage SO payment receipts }
  - { slug: formulation-adjustment, module: rnd,           action: 'crud', description: Adjust formulation (post-approval changes) }
  - { slug: formulation-manage,     module: rnd,           action: 'crud', description: Manage formulation catalog }
  - { slug: formulation,            module: rnd,           action: 'crud', description: Create / read formulation (work-in-progress) }
  - { slug: request-cogs,           module: rnd,           action: 'crud', description: Request COGS calculation (R&D → Finance) }
  - { slug: batch-record,           module: production,   action: 'crud', description: Manage batch records (BR) }
  - { slug: schedule-mixing,        module: production,   action: 'crud', description: Manage mixing schedule }
  - { slug: schedule-filling,       module: production,   action: 'crud', description: Manage filling schedule }
  - { slug: schedule-packaging,     module: production,   action: 'crud', description: Manage packaging schedule }
  - { slug: production-mixing,      module: production,   action: 'crud', description: Manage mixing run execution }
