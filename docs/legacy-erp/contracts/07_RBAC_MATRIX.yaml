# =====================================
# APPROVAL THRESHOLDS
# =====================================
# Per-transaction-type approval ladder. Amount in IDR.
# Effective from 2026-09-16 (revisable via DEC entry).

approval_thresholds:
  sales_order:
    currency: IDR
    tiers:
      - tier: self_approve
        amount_max: 10_000_000
        approvers: [BusDevStaff]
        notes: Self-approve for small orders
      - tier: standard
        amount_min: 10_000_000
        amount_max: 50_000_000
        approvers: [BusDevManager]
      - tier: vip
        amount_min: 50_000_000
        approvers: [BusDevAdmin, Director]
    requires_finance_ack: true   # FinanceStaff receives copy

  sales_sample:
    currency: IDR
    tiers:
      - tier: self_approve
        amount_max: 500_000
        approvers: [BusDevStaff]
      - tier: standard
        amount_min: 500_000
        amount_max: 2_000_000
        approvers: [BusDevManager]
      - tier: vip
        amount_min: 2_000_000
        approvers: [BusDevAdmin, RnDManager]
    requires_rnd_ack: true       # RnD needs to approve sample-make feasibility

  purchase_order:
    currency: IDR
    tiers:
      - tier: self_approve
        amount_max: 5_000_000
        approvers: [PurchasingStaff]
      - tier: standard
        amount_min: 5_000_000
        amount_max: 100_000_000
        approvers: [PurchasingAdmin]
      - tier: vip
        amount_min: 100_000_000
        approvers: [PurchasingAdmin, Director]
    requires_finance_ack: true

  purchase_invoice:
    currency: IDR
    tiers:
      - tier: staff
        amount_max: 5_000_000
        approvers: [FinanceStaff]
      - tier: manager
        amount_min: 5_000_000
        amount_max: 100_000_000
        approvers: [FinanceManager]
      - tier: vip
        amount_min: 100_000_000
        approvers: [FinanceManager, Director]

  payment:
    currency: IDR
    tiers:
      - tier: staff
        amount_max: 5_000_000
        approvers: [FinanceStaff]
      - tier: manager
        amount_min: 5_000_000
        amount_max: 100_000_000
        approvers: [FinanceManager]
      - tier: vip
        amount_min: 100_000_000
        approvers: [FinanceManager, Director]

  formulation_lock:
    tiers:
      - tier: self_lock
        approvers: [RnDChemist]
        notes: Self-lock for WIP formula (no monetary amount)
      - tier: manager_lock
        approvers: [RnDManager]
        additional_approvers: [ApotekerPenanggungJawab]  # BPOM compliance check
        notes: "RnDManager + Apoteker both required to LOCK formula"

  batch_record:
    tiers:
      - tier: operator_close
        approvers: [ProductionOperatorPackaging]
      - tier: admin_close
        approvers: [ProductionAdmin]
        additional_approvers: [ApotekerPenanggungJawab]  # QA sign-off
        notes: "Production + Apoteker both required to CLOSE batch"

  goods_writeoff:
    currency: IDR
    tiers:
      - tier: staff
        amount_max: 1_000_000
        approvers: [WarehouseStaff]
      - tier: admin
        amount_min: 1_000_000
        amount_max: 10_000_000
        approvers: [WarehouseAdmin]
      - tier: vip
        amount_min: 10_000_000
        approvers: [WarehouseAdmin, FinanceManager]
        notes: "Stock writeoff (rusak/cacad/expired)"

  coa_modify:
    tiers:
      - tier: staff
        approvers: [FinanceStaff]
        notes: Routine CoA mapping changes
      - tier: admin
        approvers: [FinanceAdmin]
        notes: "CoA code/naming changes require admin"

# =====================================
# SPECIAL PERMISSIONS
# =====================================
# Cross-cutting rules beyond the matrix above.

special:

  authenticated_default_permissions:
    description: Communication and self-service permissions granted to every authenticated user, always constrained by the parent entity ACL and tenant boundary.
    permission_slugs: [note.read, note.create, note.update, note.delete, comment.read, comment.create, attachment.read, attachment.create, tag.read, tag.update, notification.read, notification.update, user.read, status-transition.read, kpi.read.own]
    enforcement: parent-entity ACL plus own-resource constraint

  kpi_scope_permissions:
    kpi.read.own: [all_authenticated_users]
    kpi.read.division: [DivisionManager, HRAdmin, HRStaff]
    kpi.read.all: [SuperAdmin, Administrator, HRAdmin, Executive, Auditor]
    kpi.recalculate: [SuperAdmin, Administrator, HRAdmin]
    notes: Recalculate only replays immutable source events; request bodies containing score fields are rejected.

  mfa_required_for:
    description: Roles that must enroll MFA TOTP before performing sensitive actions
    roles: [Administrator, FinanceAdmin, FinanceManager, BusDevAdmin, RnDManager, SuperAdmin]
    actions: [approve, delete]
    endpoints:
      - POST /api/v1/sales-orders/:id/approve
      - POST /api/v1/purchase-orders/:id/approve
      - POST /api/v1/payments/:id/approve
      - DELETE /api/v1/{module}/{id}
    enforcement: role-policy + per-user override
    reference: _SSOT_AUTH.md §7.3

  audit_log_access:
    roles: [SuperAdmin, Administrator, Auditor]
    retention:
      hot: 12 months          # queryable from primary DB
      warm: 5 years           # queryable from archive schema
      cold: indefinite        # S3 cold storage, Auditor can request restore
    notes: "Auditor gets full retention; Administrator limited to current-year"

  impersonate_user:
    roles: [SuperAdmin]
    audit_required: true
    max_duration_minutes: 60
    notify_target_user: true     # email + in-app banner to target user
    require_mfa: true
    rate_limit: 3                # max 3 impersonation sessions per 24h
    audit_log_slug: user.impersonate
    notes: "Every action during impersonation is logged as actor=impersonator, target=impersonated"

  session_revoke:
    roles: [SuperAdmin, Administrator]
    endpoints: [DELETE /api/v1/users/:id/sessions]
    notify_target_user: true
    audit_log_slug: session.revoke

