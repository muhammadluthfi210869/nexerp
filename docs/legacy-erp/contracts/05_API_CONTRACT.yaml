                application_date: { type: string, format: date }
                expiry_date: { type: string, format: date, nullable: true }
      responses:
        '201': { description: 'Recorded with stage DRAFT; audit risk derived, never hardcoded' }
        '422': { description: Validation error }

  /legality/records/{id}/logs:
    get:
      tags: [legalitas]
      operationId: listPermitLogs
      summary: Append-only history for one permit record
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
        - { name: type, in: query, schema: { type: string, enum: [HKI, BPOM, HALAL] } }
      responses:
        '200': { description: Ordered permit history }

# ============================================================
# COMMON COMPONENTS
# ============================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: refresh
      description: "HttpOnly refresh token (per _SSOT_AUTH.md §2.2)"

  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    Page:
      in: query
      name: page
      schema: { type: integer, default: 1, minimum: 1 }
    PageSize:
      in: query
      name: limit
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
    Cursor:
      in: query
      name: cursor
      schema: { type: string, description: "Opaque cursor (base64 of {createdAt,id})" }
    Sort:
      in: query
      name: sort
      schema: { type: string, example: "createdAt:desc", description: "field:asc|desc" }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, format: uuid }
      description: "24h TTL — replay returns cached response"

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Not authenticated (token missing/expired)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Authenticated but lacks permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found (or soft-deleted)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Resource conflict (duplicate, FK violation)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnprocessableEntity:
      description: Business rule violation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Too many requests (per 09 §9)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    # === COMMON ===
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: "Canonical error code (per 09 §19)"
              enum: [VALIDATION_FAILED, BAD_REQUEST, UNAUTHORIZED, TOKEN_EXPIRED, TOKEN_INVALID, MFA_REQUIRED, SESSION_REVOKED, FORBIDDEN, NOT_FOUND, METHOD_NOT_ALLOWED, CONFLICT, UNPROCESSABLE_ENTITY, INVALID_STATE_TRANSITION, PASSWORD_POLICY_VIOLATION, RATE_LIMITED, INTERNAL_ERROR, SERVICE_UNAVAILABLE, MAINTENANCE_MODE]
            message: { type: string, description: "User-facing message (Indonesian default)" }
            field: { type: string, description: "Validation field, if applicable" }
            details:
              type: object
              additionalProperties: true
            trace_id: { type: string, description: "Correlation ID for support" }

    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        has_more: { type: boolean }
        next_cursor: { type: string, nullable: true }

    # === AUTH & USERS ===
    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Role:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        description: { type: string, nullable: true }
        is_system: { type: boolean }
        legacy_id: { type: integer, nullable: true, description: "Preserved 1-16 (DEC-025)" }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Permission:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, description: "kebab-case (DEC-024)" }
        module: { type: string }
        action: { type: string, enum: [read, create, update, delete, approve, export, import] }
        description: { type: string, nullable: true }
        category: { type: string, enum: [sub-module, dashboard, special], nullable: true }

    User:
