  # ============================================================
  # FINANCE — Journal Entries (5 endpoints)
  # ============================================================
  /finance/journal-entries:
    get:
      tags: [finance]
      operationId: listJournalEntries
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, PENDING, APPROVED, POSTED, REVERSED] } }
        - { name: type, in: query, schema: { type: string, description: "MANUAL|SAMPLE_INVOICE|GOODS_RECEIPT|STOCK_OPNAME|ADJUSTMENT" } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Journal entries (JU-YYMM-XXXX)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/JournalEntry' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
    post:
      tags: [finance]
      operationId: createJournalEntry
      summary: Manual journal entry (auto-journal is default for transactional events)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, description, lines]
              properties:
                date: { type: string, format: date }
                description: { type: string }
                type: { type: string, default: MANUAL }
                reference: { type: string }
                source_entity_type: { type: string }
                source_entity_id: { type: string, format: uuid }
                is_adjustment: { type: boolean, default: false }
                locked_period: { type: string, description: "YYYY-MM if for hard-locked period" }
                lines:
                  type: array
                  minItems: 2
                  items:
                    type: object
                    required: [coa_id, debit, credit]
                    properties:
                      coa_id: { type: string, format: uuid }
                      debit: { type: integer, minimum: 0 }
                      credit: { type: integer, minimum: 0 }
                      note: { type: string }
      responses:
        '201':
          description: Created — lines must balance (sum debit = sum credit)

  /finance/journal-entries/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [finance]
      operationId: getJournalEntry
      responses:
        '200':
          description: Journal entry detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/JournalEntry' }
    patch:
      tags: [finance]
      operationId: updateJournalEntry
      responses:
        '200':
          description: Updated
    delete:
      tags: [finance]
      operationId: deleteJournalEntry
      responses:
        '204': { description: Deleted }

  /finance/journal-entries/{id}/post:
    post:
      tags: [finance]
      operationId: postJournalEntry
      summary: Transition DRAFT → POSTED (irreversible without admin reverse)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Posted

  /finance/journal-entries/{id}/reverse:
    post:
      tags: [finance]
      operationId: reverseJournalEntry
      summary: Reverse a posted entry (admin only — generates counter-entry)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Reversed — counter-entry created

