openapi: 3.0.3
x-contract-status: PROVISIONAL
x-authority-map: 00_MASTER_SPEC.md#91-canonical-subject-based-authority-map
info:
  title: NEX ERP API
  version: 1.0.0
  description: |
    REST API for NEX ERP — replacement for legacy `code.gserp.id` / `kil.gserp.id`.

    ## Conventions (per 09_NON_FUNCTIONAL_CONTRACT.md §9)
    - All endpoints require Bearer JWT (`Authorization: Bearer <token>`)
    - Refresh token rotation uses `POST /auth/refresh` with HttpOnly cookie `refresh`
    - Money in API = integer Rupiah (no subunit); dates ISO-8601 with `+07:00` (WIB)
    - Error envelope: `{ "error": { "code", "message", "field?", "details?", "trace_id" } }`
    - Success envelope: `{ "data": ..., "meta": { "page", "limit", "total", "has_more", "next_cursor" } }`
    - All `POST/PUT/PATCH/DELETE` support `Idempotency-Key: <uuid>` header (24h TTL)

    ## Auth
    See `_SSOT_AUTH.md` for full auth flow (JWT + refresh rotation + MFA).

    ## Status Codes
    200 OK / 201 Created / 204 No Content / 400 Bad Request / 401 Unauthorized /
    403 Forbidden / 404 Not Found / 409 Conflict / 422 Unprocessable Entity /
    429 Rate Limited / 500 Internal / 503 Unavailable

    ## Authoritative source
    - Module list: 00_MASTER_SPEC.md
    - Entity catalog: schema.prisma (generated physical count is reported by the validator; APIs are capability-driven, not CRUD-per-model)
    - RBAC: 07_RBAC_MATRIX.yaml
    - Workflow: 03_WORKFLOW_STATE_MACHINE.yaml

servers:
  - url: https://nexerp.id/api/v1
    description: Production
  - url: https://staging.nexerp.id/api/v1
    description: Staging
  - url: http://localhost:3000/api/v1
    description: Local development

security:
  - bearerAuth: []

tags:
  - { name: auth, description: Authentication & authorization }
  - { name: users, description: User CRUD, role assignment, session management }
  - { name: roles, description: Role & permission matrix }
  - { name: master, description: Master data (Customer, Supplier, Goods, Warehouse, COA, Formulation) }
  - { name: sales, description: Sales pipeline (Leads → Sample → SO → Invoice → Payment → Return) }
  - { name: purchase, description: Purchase pipeline (PR → PO → GR → Invoice → Payment → Return) }
  - { name: production, description: Batch Record → Schedule → Mixing/Filling/Packaging → Delivery }
  - { name: warehouse, description: Stock movements, opname, adjustment, transfers }
  - { name: finance, description: GL, AR/AP, journal entries, cash/bank, reports }
  - { name: reports, description: Cross-module reports (P&L, BS, AR/AP aging, etc.) }
  - { name: checklists, description: 17-stage project checklists }
  - { name: rnd, description: R&D formulations and adjustments }
  - { name: communication, description: Notes, comments, tags, attachments, notifications }
  - { name: audit, description: Audit & activity logs }
  - { name: dashboards, description: Per-role dashboard aggregations }
  - { name: hr, description: Employee and contract administration }
  - { name: kpi, description: Event-derived employee KPI scorecards and evidence }
  - { name: files, description: File upload (presigned URLs) }
  - { name: creative, description: Design/artwork tasks, versions, approvals and finalized designs }
  - { name: legalitas, description: Permit records (BPOM / HKI-Merek / Halal) and expiry monitoring }

paths:
  # ============================================================
  # AUTH (12 endpoints)
  # ============================================================
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Login with email + password (optional MFA)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
                mfa_code: { type: string, description: "TOTP code if MFA enabled" }
                remember: { type: boolean, default: false }
                recaptcha_token: { type: string }
      responses:
        '200':
          description: Login success — sets HttpOnly cookies
          headers:
            Set-Cookie:
              schema: { type: string }
              description: "Sets token + refresh cookies"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      access_token: { type: string }
                      user: { $ref: '#/components/schemas/User' }
                      role: { $ref: '#/components/schemas/Role' }
                      permissions: { type: array, items: { type: string } }
                      requires_mfa: { type: boolean }
                      mfa_token: { type: string, description: "Short-lived JWT to exchange for full session after MFA verify" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Rotate access + refresh token pair
      security:
        - cookieAuth: []
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      access_token: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Logout current session (blacklists tokens)
      responses:
        '204': { description: Logged out }

  /auth/logout-all:
    post:
      tags: [auth]
      operationId: logoutAllSessions
      summary: Revoke all sessions for current user
      responses:
        '204': { description: All sessions revoked }

  /auth/forgot-password:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Request password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                recaptcha_token: { type: string }
      responses:
        '200':
          description: Email sent if account exists (no enumeration)

  /auth/reset-password:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Reset password with email token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, minLength: 10 }
                new_password_confirm: { type: string }
      responses:
        '200': { description: Password reset }
        '401': { description: Invalid/expired token }

  /auth/change-password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change own password (authenticated)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 10 }
      responses:
        '204': { description: Password changed }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /auth/mfa/setup:
    post:
      tags: [auth]
      operationId: setupMfa
      summary: Initialize TOTP MFA enrollment
      responses:
        '200':
          description: QR URL + secret + recovery codes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      qr_url: { type: string, description: "otpauth:// URL for QR" }
                      secret: { type: string }
                      recovery_codes: { type: array, items: { type: string } }

  /auth/mfa/verify:
    post:
      tags: [auth]
      operationId: verifyMfa
      summary: Verify TOTP code (enrollment or login challenge)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [totp_code]
              properties:
                totp_code: { type: string }
                mfa_token: { type: string, description: "From /auth/login when MFA required" }
      responses:
        '200':
          description: MFA verified — returns full session
        '401': { description: Invalid TOTP code }

  /auth/mfa/disable:
    post:
      tags: [auth]
      operationId: disableMfa
      summary: Disable MFA (requires current password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties:
                current_password: { type: string }
      responses:
        '204': { description: MFA disabled }

  /auth/sessions:
    get:
      tags: [auth]
      operationId: listActiveSessions
      summary: List current user's active sessions
      responses:
        '200':
          description: Sessions list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/UserSession' }

  /auth/sessions/{id}:
    delete:
      tags: [auth]
      operationId: revokeSession
      summary: Revoke a specific session
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Session revoked }

  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Get current user profile + permissions
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      role: { $ref: '#/components/schemas/Role' }
                      permissions: { type: array, items: { type: string } }

  # ============================================================
  # USERS (8 endpoints)
  # ============================================================
  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users (admin)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: role_id, in: query, schema: { type: string, format: uuid } }
        - { name: is_active, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string }, description: Search name/email/employee_code }
      responses:
        '200':
          description: Users list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/User' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [users]
      operationId: createUser
      summary: Create new user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, full_name, role_id]
              properties:
                email: { type: string, format: email }
                full_name: { type: string }
                employee_code: { type: string }
                phone: { type: string }
                role_id: { type: string, format: uuid }
                password: { type: string, description: "Optional — auto-generated if absent (force reset on first login)" }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [users]
      operationId: getUser
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [users]
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: { type: string }
                phone: { type: string }
                avatar_url: { type: string }
                role_id: { type: string, format: uuid }
                is_active: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Soft-delete user
      responses:
        '204': { description: Deleted }

  /users/{id}/sessions:
    get:
      tags: [users]
      operationId: listUserSessions
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: User's active sessions (admin view)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/UserSession' }

  /users/{id}/logout-all:
    post:
      tags: [users]
      operationId: forceLogoutUser
      summary: Force logout all sessions for a user (admin)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: All sessions revoked }

  /users/{id}/reset-password:
    post:
      tags: [users]
      operationId: adminResetPassword
      summary: Admin-force password reset (user must change on next login)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      temporary_password: { type: string }

  /users/{id}/mfa-required:
    post:
      tags: [users]
      operationId: setMfaRequired
      summary: Force MFA enrollment for user (admin)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: MFA enforced }

  /profile:
    get:
      tags: [users]
      operationId: getOwnProfile
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
    patch:
      tags: [users]
      operationId: updateOwnProfile
      summary: Update own profile (limited fields)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: { type: string }
                phone: { type: string }
                avatar_url: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }

  # ============================================================
  # ROLES (6 endpoints)
  # ============================================================
  /roles:
    get:
      tags: [roles]
      operationId: listRoles
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Roles list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Role' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
    post:
      tags: [roles]
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                permission_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Role' }

  /roles/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [roles]
      operationId: getRole
      responses:
        '200':
          description: Role with permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Role' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [roles]
      operationId: updateRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                permission_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Role' }
    delete:
      tags: [roles]
      operationId: deleteRole
      responses:
        '204': { description: Deleted }

  /permissions:
    get:
      tags: [roles]
      operationId: listPermissions
      summary: List all permissions (canonical slugs)
      parameters:
        - { name: module, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string, enum: [sub-module, dashboard, special] } }
      responses:
        '200':
          description: Permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Permission' } }

  # ============================================================
  # MASTER DATA — Customers (5 endpoints)
  # ============================================================
  /customers:
    get:
      tags: [master]
      operationId: listCustomers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: category_id, in: query, schema: { type: string, format: uuid } }
        - { name: owner_user_id, in: query, schema: { type: string, format: uuid } }
        - { name: is_active, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: Customers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Customer' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
    post:
      tags: [master]
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Customer' }
        '409': { $ref: '#/components/responses/Conflict' }

  /customers/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [master]
      operationId: getCustomer
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Customer' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [master]
      operationId: updateCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Customer' }
    delete:
      tags: [master]
      operationId: deleteCustomer
      responses:
        '204': { description: Deleted }

  /customer-categories:
    get:
      tags: [master]
      operationId: listCustomerCategories
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/CustomerCategory' } }
    post:
      tags: [master]
      operationId: createCustomerCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CustomerCategory' }

  /customer-categories/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [master]
      operationId: getCustomerCategory
      responses:
        '200': { description: Customer category detail }
    patch:
      tags: [master]
      operationId: updateCustomerCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CustomerCategory' }
    delete:
      tags: [master]
      operationId: deleteCustomerCategory
      responses:
        '204': { description: Deleted }

  # ============================================================
  # MASTER DATA — Suppliers (5 endpoints)
  # ============================================================
  /suppliers:
    get:
      tags: [master]
      operationId: listSuppliers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: category_id, in: query, schema: { type: string, format: uuid } }
        - { name: is_active, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: Suppliers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Supplier' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
    post:
      tags: [master]
      operationId: createSupplier
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierInput' }
      responses:
        '201':
          description: Created

  /suppliers/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [master]
      operationId: getSupplier
      responses:
        '200':
          description: Supplier
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Supplier' }
    patch:
      tags: [master]
      operationId: updateSupplier
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierInput' }
      responses:
        '200':
          description: Updated
    delete:
      tags: [master]
      operationId: deleteSupplier
      responses:
        '204': { description: Deleted }

  /supplier-categories:
    get:
      tags: [master]
      operationId: listSupplierCategories
      responses:
        '200':
          description: 4-pillar categories (Bahan Baku, Kemasan Primer, Kemasan Sekunder, Bahan Pembantu)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/SupplierCategory' } }
    post:
      tags: [master]
      operationId: createSupplierCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: Created

  /supplier-categories/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [master]
      operationId: getSupplierCategory
      responses:
        '200': { description: Supplier category detail }
    patch:
      tags: [master]
      operationId: updateSupplierCategory
      responses:
        '200':
          description: Updated
    delete:
      tags: [master]
      operationId: deleteSupplierCategory
      responses:
        '204': { description: Deleted }

  # ============================================================
  # MASTER DATA — Goods (8 endpoints)
  # ============================================================
  /goods:
    get:
      tags: [master]
      operationId: listGoods
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: category_id, in: query, schema: { type: string, format: uuid } }
        - { name: ownership_type, in: query, schema: { type: string, enum: [OWNED_ASSET, CUSTOMER_CONSIGNMENT] } }
        - { name: is_active, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: Goods
          content:
            application/json:
              schema:
