        organization_id: { type: string, format: uuid }
        type: { type: string, enum: [PPN, PPH21, PPH23, PPH_FINAL] }
        name: { type: string }
        rate: { type: number, description: "e.g. 11.00 for PPN" }
        gl_coa_id: { type: string, format: uuid, nullable: true }
        effective_date: { type: string, format: date }
        expiry_date: { type: string, format: date, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    FixedAsset:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        code: { type: string, description: "AST-YYYYMMDD-XXXX" }
        name: { type: string }
        category: { type: string, enum: [INVENTARIS, MOTOR, MOBIL, BANGUNAN_PERMANEN, INTANGIBLE] }
        acquisition_date: { type: string, format: date }
        acquisition_cost: { type: integer }
        useful_life: { type: integer, description: "years" }
        salvage_value: { type: integer, default: 0 }
        accumulated_depreciation: { type: integer, default: 0 }
        book_value: { type: integer }
        depreciation_method: { type: string, default: STRAIGHT_LINE }
        location: { type: string, nullable: true }
        department: { type: string, nullable: true }
        source_type: { type: string, nullable: true, enum: [MANUAL, PURCHASE_INVOICE] }
        source_invoice_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [ACTIVE, TRANSFERRED, DISPOSED] }
        legacy_id: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Budget:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        period: { type: string, description: "YYYY-MM" }
        fiscal_year: { type: integer }
        department: { type: string, nullable: true }
        coa_id: { type: string, format: uuid, nullable: true }
        amount: { type: integer }
        version: { type: string, enum: [DRAFT, APPROVED], default: DRAFT }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    FundRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        code: { type: string }
        requester_id: { type: string, format: uuid }
        department: { type: string, nullable: true }
        purpose: { type: string }
        amount: { type: integer }
        needed_date: { type: string, format: date, nullable: true }
        attachment: { type: string, nullable: true }
        current_level: { type: integer, default: 1, description: "1=Head, 2=Accounting, 3=Director" }
        status: { type: string, enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, DISBURSED, CLOSED] }
        approver_id: { type: string, format: uuid, nullable: true }
        disburser_id: { type: string, format: uuid, nullable: true }
        disbursed_at: { type: string, format: date-time, nullable: true }
        cash_bank_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # === CHECKLIST ===
    ChecklistCategory:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        name: { type: string }
        order: { type: integer }
        days_per_category: { type: integer, nullable: true }
        after_category_id: { type: string, format: uuid, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Checklist:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        code: { type: string, nullable: true }
        sales_order_id: { type: string, format: uuid, nullable: true }
        customer_id: { type: string, format: uuid, nullable: true }
        product_name: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
        status: { type: string, enum: [OPEN, IN_PROGRESS, COMPLETED, CANCELLED] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ChecklistProgress:
      type: object
      properties:
        id: { type: string, format: uuid }
        checklist_id: { type: string, format: uuid }
        checklist_category_id: { type: string, format: uuid }
        stage_name: { type: string }
        status: { type: string, enum: [NOT_STARTED, IN_PROGRESS, DONE, BLOCKED] }
        deadline: { type: string, format: date, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
        evidence: { type: string, nullable: true }
        approver: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ChecklistTracking:
      type: object
      properties:
        id: { type: string, format: uuid }
        checklist_id: { type: string, format: uuid }
        current_stage: { type: string, nullable: true }
        overall_status: { type: string, default: OPEN }
        deadline: { type: string, format: date, nullable: true }
        progress_pct: { type: number, default: 0 }
        updated_at: { type: string, format: date-time }

    # === COMMUNICATION ===
    Note:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        entity_type: { type: string }
        entity_id: { type: string, format: uuid }
        author_id: { type: string, format: uuid }
        body: { type: string, description: "Markdown" }
        visibility: { type: string, enum: [ALL, INTERNAL, ADMIN] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    StatusTransition:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        entity_type: { type: string }
        entity_id: { type: string, format: uuid }
        from_status: { type: string }
        to_status: { type: string }
        from_user_id: { type: string, format: uuid }
        to_user_id: { type: string, format: uuid, nullable: true }
        to_role_id: { type: string, format: uuid, nullable: true }
        notes: { type: string, nullable: true }
        sla_deadline: { type: string, format: date-time, nullable: true }
        acknowledged_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    Tag:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        type: { type: string, enum: [USER, ROLE, DIVISION] }
        target_id: { type: string, format: uuid }
        context_type: { type: string, enum: [NOTE, COMMENT, TRANSITION] }
        context_id: { type: string, format: uuid }
        mentioned_by_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    Comment:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        entity_type: { type: string }
        entity_id: { type: string, format: uuid }
        author_id: { type: string, format: uuid }
        body: { type: string }
        related_entity_type: { type: string, nullable: true, description: "DEC-013 cross-ref limited" }
        related_entity_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }

    Attachment:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        entity_type: { type: string }
        entity_id: { type: string, format: uuid }
        filename: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer }
        storage_url: { type: string }
        uploader_id: { type: string, format: uuid }
        description: { type: string, nullable: true }
        uploaded_at: { type: string, format: date-time }

    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        recipient_user_id: { type: string, format: uuid }
        type: { type: string, enum: [MENTION, APPROVAL_REQUEST, SLA_WARNING, SLA_BREACH, STATUS_CHANGED, SYSTEM] }
        context_type: { type: string, nullable: true }
        context_id: { type: string, format: uuid, nullable: true }
        title: { type: string }
        body: { type: string, nullable: true }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    # === HR ===
    Employee:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        division_id: { type: string, format: uuid, nullable: true }
        contract_type: { type: string, nullable: true, enum: [PERMANENT, CONTRACT, INTERN] }
        contract_end_date: { type: string, format: date, nullable: true }
        manager_user_id: { type: string, format: uuid, nullable: true }
        labor_grade: { type: string, nullable: true }
        join_date: { type: string, format: date, nullable: true }
        resign_date: { type: string, format: date, nullable: true }
        status: { type: string, enum: [ACTIVE, RESIGNED, SUSPENDED] }
        base_salary: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    KpiDefinition:
      type: object
      required: [id, key, name, direction, target_value, weight, formula_rule_id, source_event, attribution_key]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        division: { type: string, nullable: true }
        direction: { type: string, enum: [HIGHER, LOWER, ZERO] }
        unit: { type: string }
        target_value: { type: number }
        weight: { type: number, minimum: 0 }
        formula_rule_id: { type: string, pattern: '^BUS-RULE-[0-9]{3}$' }
        source_event: { type: string }
        attribution_key: { type: string }
        is_active: { type: boolean }

    EmployeeKpiResult:
      type: object
      required: [id, employee_id, definition, period, evidence, calculation_version, calculated_at]
      properties:
        id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        definition: { $ref: '#/components/schemas/KpiDefinition' }
        period: { type: string }
        numerator: { type: number, nullable: true }
        denominator: { type: number, nullable: true }
        value: { type: number, nullable: true }
        achievement_score: { type: number, nullable: true }
        weighted_score: { type: number, nullable: true }
        evidence:
          type: array
          items:
            type: object
            required: [event_id, event_type, entity_type, entity_id, occurred_at]
            properties:
              event_id: { type: string, format: uuid }
              event_type: { type: string }
              entity_type: { type: string }
              entity_id: { type: string, format: uuid }
              actor_field: { type: string }
              occurred_at: { type: string, format: date-time }
        calculation_version: { type: string }
        calculated_at: { type: string, format: date-time }
        finalized_at: { type: string, format: date-time, nullable: true }

    EmployeePerformance:
      type: object
      required: [id, employee_id, period, status, results]
      properties:
        id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        period: { type: string }
        kpi_score: { type: number, nullable: true, description: 'Null means N/A; never coerced to zero.' }
        division: { type: string, nullable: true }
        status: { type: string, enum: [DRAFT, CALCULATED, FINALIZED] }
        results: { type: array, items: { $ref: '#/components/schemas/EmployeeKpiResult' } }

# ============================================================
# END OF SPEC
