# ── Watchtower: Auto-update containers ──
# Cara pakai:
#   1. Build & push image ke Docker Hub / GHCR manual
#   2. Watchtower otomatis deteksi image baru & restart
#   3. Tanpa SSH sama sekali (setelah setup awal)
#
# docker compose -f docker-compose.watchtower.yml up -d

services:
  watchtower:
    image: containrrr/watchtower:latest
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true          # Hapus image lama
      - WATCHTOWER_POLL_INTERVAL=60      # Cek tiap 60 detik
      - WATCHTOWER_ROLLING_RESTART=true  # Restart 1 container dulu, baru lanjut
      - WATCHTOWER_INCLUDE_STOPPED=true  # Juga restart container yang mati
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
