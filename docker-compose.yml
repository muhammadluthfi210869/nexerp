# ═══════════════════════════════════════════════════════════════
#  NexERP — Satu file untuk Semua Environment
# ═══════════════════════════════════════════════════════════════
#  Lokal:  docker compose up --build
#  Server: docker compose --profile server up -d --build
#
#  Prinsip: file ini IDENTIK di lokal dan server.
#  Yang beda cuma file .env (isi secret masing-masing).
# ═══════════════════════════════════════════════════════════════

services:
  # ── Database ────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-erp_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-erp_password_secure}
      POSTGRES_DB: ${DB_NAME:-erp_database}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-erp_user} -d ${DB_NAME:-erp_database}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (NestJS + Prisma) ───────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-erp_user}:${DB_PASSWORD:-erp_password_secure}@db:5432/${DB_NAME:-erp_database}?schema=public
      PORT: 3001
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi di file .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-60m}
      AES_SECRET_KEY: ${AES_SECRET_KEY:-aureon_erp_v4_ultra_secret_key_32}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # ── Google Sheets API (Toribio Dashboard) ──
      GOOGLE_SHEETS_PRIVATE_KEY: ${GOOGLE_SHEETS_PRIVATE_KEY:-}
      GOOGLE_SHEETS_CLIENT_EMAIL: ${GOOGLE_SHEETS_CLIENT_EMAIL:-}
      TORIBIO_SPREADSHEET_ID: ${TORIBIO_SPREADSHEET_ID:-1J1sdzYNVThhUGanHyYWETH6Lr3dlT77ckKZ5d89OEvU}
      TORIBIO_REFRESH_INTERVAL_MS: ${TORIBIO_REFRESH_INTERVAL_MS:-60000}
      KOMMO_SUBDOMAIN: ${KOMMO_SUBDOMAIN:-}
      KOMMO_API_TOKEN: ${KOMMO_API_TOKEN:-}
      KOMMO_AUTO_PULL_ENABLED: ${KOMMO_AUTO_PULL_ENABLED:-true}
      KOMMO_AUTO_PULL_INTERVAL_MS: ${KOMMO_AUTO_PULL_INTERVAL_MS:-300000}
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/dirlif-project-cbab4f5a2ec6.json:/app/dirlif-project-cbab4f5a2ec6.json:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:3001/health 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Frontend (Next.js Standalone) ───────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NODE_ENV: production
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:3000 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ═══════════════════════════════════════════════════════════
  #  Layanan SERVER — hanya aktif dengan --profile server
  #  Di lokal: docker compose up --build  (services ini DI-SKIP)
  #  Di VPS:   docker compose --profile server up -d --build
  # ═══════════════════════════════════════════════════════════

  # ── Nginx Reverse Proxy + SSL ───────────────────────────────
  nginx:
    profiles: ["server"]
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend

  # ── Certbot (SSL Auto-Renew) ────────────────────────────────
  certbot:
    profiles: ["server"]
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  postgres_data:
