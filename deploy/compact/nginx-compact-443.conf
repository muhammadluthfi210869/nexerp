    # COMPACT V2 — HTTPS proxy to isolated container
    server {
        listen 443 ssl;
        http2 on;
        server_name compact.nexerp.id;

        ssl_certificate /etc/letsencrypt/live/compact.nexerp.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/compact.nexerp.id/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        set $compact_upstream http://compact-frontend:3000;
        location / {
            proxy_pass $compact_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        }
    }
