    # ── PROTOTYPE demo.nexerp.id (port 443: proxy ke container prototype) ──
    # Tambahkan SETELAH cert SSL demo.nexerp.id diterbitkan.
    server {
        listen 443 ssl;
        http2 on;
        server_name demo.nexerp.id;
        ssl_certificate /etc/letsencrypt/live/demo.nexerp.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/demo.nexerp.id/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Pakai variable agar resolver Docker me-resolve container saat runtime.
        set $prototype_upstream http://prototype-frontend:3000;

        location / {
            proxy_pass $prototype_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        }
    }
