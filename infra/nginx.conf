events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upload attachment task (gambar/dokumen) — default nginx 1MB akan menolak
    # upload >1MB dengan 413 (BUG-A-01). 15MB > limit backend 10MB.
    client_max_body_size 15m;

    # Docker DNS resolver — enables runtime resolution for upstreams
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name nexerp.id www.nexerp.id;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name nexerp.id www.nexerp.id;

        ssl_certificate /etc/letsencrypt/live/nexerp.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nexerp.id/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Use variables so nginx resolves DNS at runtime, not at startup
        set $frontend_upstream http://frontend:3000;
        set $backend_upstream http://backend:3001;

        # Aset statis Next.js (konten di-hash) — aman di-cache immutable.
        # Jangan terapkan ke /api/ (prefix location menang) & bukan HTML.
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?|map)$ {
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # HTML & halaman lain — TIDAK boleh di-cache lama. Sebelumnya Next.js
        # mengirim `s-maxage=31536000` pada halaman prerender → proxy/browser
        # bisa menyimpan halaman LAMA (dan JS lama) sampai setahun, sehingga
        # user melihat versi aplikasi lama setelah deploy (bug notes abu-abu di
        # laptop tertentu). no-store memaksa selalu ambil versi terbaru.
        location / {
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        }

        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
    


    

    # COMPACT V2 — HTTP ACME and redirect
    


    # COMPACT V2 — HTTPS proxy to isolated container
    

}
